<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>组件示例页（完整交互长页）入口检查</title>
  <style>
    body {
      font: 14px system-ui;
      margin: 20px;
      background: #f2f3f5;
    }
    iframe {
      display: block;
      width: 1100px;
      height: 844px;
      border: 1px solid #ddd;
      margin-top: 20px;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
  <main>
    <h1>组件示例页入口（examples/vue）</h1>
    <button id="run">运行定向检查</button>
    <pre id="result">尚未运行</pre>
    <div id="fixture"></div>
  </main>
  <script type="module">
    if (new URLSearchParams(location.search).has('frame')) {
      // 与 examples/vue/index.html 一致：同一个入口脚本，资源按项目根解析。
      document.body.innerHTML = '<div id="app"></div>'
      const base = document.createElement('base')
      base.href = '/examples/vue/'
      document.head.append(base)
      await import('/examples/vue/src/main.ts')
    } else {
      const reports = [],
        pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
      const assert = (condition, message) => {
        if (!condition) throw Error(message)
      }
      const until = async (check, message) => {
        const start = performance.now()
        while (!check()) {
          if (performance.now() - start > 10000) throw Error(message)
          await pause(30)
        }
      }
      let frame, doc, win
      const check = async (name, run) => {
        document.querySelector('#result').textContent = '运行中：' + name
        await run()
        reports.push({ name, passed: true })
      }
      const showcase = () => doc.querySelector('.showcase-layout')
      const nav = () => [...showcase().querySelectorAll('.site-nav a')]
      const sections = ['actions', 'controls', 'surfaces', 'feedback', 'scenarios']
      const waitShowcase = async () => {
        await until(() => showcase(), '长页未渲染')
        await until(
          () => sections.every((id) => showcase().querySelector('#showcase-' + id + ' [data-my-component]')),
          '长页异步组件未加载'
        )
      }
      document.querySelector('#run').onclick = async () => {
        document.querySelector('#run').disabled = true
        reports.length = 0
        try {
          frame = document.createElement('iframe')
          // 不带 hash：验证默认落到长页。
          frame.src = '/tests/long-page.browser.html?frame=1'
          document.querySelector('#fixture').replaceChildren(frame)
          await until(() => frame.contentDocument?.querySelector('.showcase-layout'), '长页未加载')
          doc = frame.contentDocument
          win = frame.contentWindow

          await check('无地址进入时落到长页，五组完整交互都已挂载且没有栏目底栏', async () => {
            await waitShowcase()
            assert(win.location.hash === '#/showcase', '默认入口没有落到 #/showcase：' + win.location.hash)
            assert(showcase().querySelector('.hero h1').textContent.includes('自然留白'), '缺少头图')
            assert(showcase().querySelectorAll('.sample-window,.float-chip').length === 3, '头图卡片缺失')
            for (const id of sections)
              assert(showcase().querySelector('#showcase-' + id), '缺少分区 ' + id)
            assert(!doc.querySelector('[data-demo-tabbar]'), '组件示例页出现了栏目底栏')
            assert(!doc.querySelector('.demo-app'), '组件示例页挂载了栏目布局')
            assert(!doc.querySelector('.demo-catalog'), '组件示例页挂载了组件目录')
          })

          await check('分类导航驱动选中状态与顶栏阴影', async () => {
            assert(nav().length === 6, '分类导航数量不对：' + nav().length)
            assert(nav().at(-1).textContent.includes('原生 HTML'), '缺少原生 HTML 入口链接')
            nav()[1].click()
            await until(
              () => nav().find((item) => item.getAttribute('aria-current') === 'location')?.textContent === '交互控制',
              '分类选中状态未更新'
            )
            await pause(550)
            const header = showcase().querySelector('.masthead').getBoundingClientRect(),
              target = showcase().querySelector('#showcase-controls').getBoundingClientRect()
            assert(target.top >= header.bottom - 2 && target.top < header.bottom + 45, '分类被导航头遮挡')
            assert(showcase().querySelector('.masthead.scrolled'), '滚动后顶栏没有阴影')
            showcase().scrollTo({ top: 0, behavior: 'instant' })
            await pause(120)
            assert(!showcase().querySelector('.masthead.scrolled'), '回到顶部后顶栏阴影未移除')
            assert(win.location.hash === '#/showcase', '锚点变成了页面跳转')
          })

          await check('分类导航从页面底部把长页带回分区顶部（页面没有独立的回到顶部控件）', async () => {
            showcase().scrollTo({ top: showcase().scrollHeight, behavior: 'instant' })
            await pause(120)
            const bottom = showcase().scrollTop
            assert(bottom > 1000, '长页没有可滚动内容')
            nav()[0].click()
            await pause(550)
            assert(showcase().scrollTop < bottom / 2, '分类导航没有把长页带回分区顶部')
            const header = showcase().querySelector('.masthead').getBoundingClientRect(),
              target = showcase().querySelector('#showcase-actions').getBoundingClientRect()
            assert(target.top >= header.bottom - 2 && target.top < header.bottom + 45, '分区没有对齐导航头')
          })

          await check('明暗令牌对长页生效（长页自身不提供主题入口）', async () => {
            assert(
              !doc.querySelector('[aria-label="主题定制"],[aria-label^="切换到"]'),
              '长页不应出现主题设置入口'
            )
            const style = () => win.getComputedStyle(showcase()).backgroundColor
            const before = style()
            doc.documentElement.dataset.theme = 'dark'
            await pause(120)
            assert(doc.documentElement.dataset.theme === 'dark', '暗黑模式没有生效')
            assert(style() !== before, '长页背景没有跟随主题令牌')
            delete doc.documentElement.dataset.theme
            await pause(120)
            assert(style() === before, '恢复亮色后背景没有还原')
          })

          await check('长页不注入模块脚本，也没有站外或绝对路径资源', async () => {
            assert(doc.querySelectorAll('script[type="module"]').length === 0, '长页注入了模块脚本')
            const origin = win.location.origin
            assert(
              win.performance.getEntriesByType('resource').every((entry) => entry.name.startsWith(origin)),
              '长页请求了站外资源'
            )
            const located = [...doc.querySelectorAll('[src],[href]')].filter((node) => node.tagName !== 'BASE')
            for (const node of located) {
              const value = node.getAttribute('src') ?? node.getAttribute('href')
              assert(!value.startsWith('/') && !/^[a-z][a-z\d+.-]*:/i.test(value), '出现绝对路径资源：' + value)
            }
          })

          await check('显式带地址打开时保持原地址，重定向只对空地址生效', async () => {
            const previous = doc
            // 换一个查询参数让 iframe 真正重新加载，否则只改 hash 不会重新执行入口脚本。
            frame.src = '/tests/long-page.browser.html?frame=1&direct=1#/home'
            await until(
              () => frame.contentDocument !== previous && frame.contentDocument?.querySelector('[data-demo-page="home"]'),
              '显式地址没有进入组件目录'
            )
            doc = frame.contentDocument
            win = frame.contentWindow
            await pause(160)
            assert(win.location.hash === '#/home', '显式 #/home 被重定向：' + win.location.hash)
            assert(!doc.querySelector('.showcase-layout'), '显式 #/home 仍渲染了长页')
          })

          document.querySelector('#result').textContent = JSON.stringify(
            { passed: true, total: 6, reports },
            null,
            2
          )
        } catch (error) {
          document.querySelector('#result').textContent = JSON.stringify(
            { passed: false, error: String(error.stack || error), reports },
            null,
            2
          )
        } finally {
          document.querySelector('#run').disabled = false
        }
      }
    }
  </script>
</html>
