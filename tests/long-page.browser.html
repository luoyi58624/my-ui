<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>组件示例页（完整交互长页）入口检查</title>
  <style>
    body {
      font: 14px system-ui;
      margin: 20px;
      background: #f2f3f5;
    }
    iframe {
      display: block;
      width: 1100px;
      height: 844px;
      border: 1px solid #ddd;
      margin-top: 20px;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
  <main>
    <h1>组件示例页入口（examples/vue）</h1>
    <button id="run">运行定向检查</button>
    <pre id="result">尚未运行</pre>
    <div id="fixture"></div>
  </main>
  <script type="module">
    if (new URLSearchParams(location.search).has('frame')) {
      // 与 examples/vue/index.html 一致：同一个入口脚本，资源按项目根解析。
      document.body.innerHTML = '<div id="app"></div>'
      const base = document.createElement('base')
      base.href = '/examples/vue/'
      document.head.append(base)
      const firstMount = new MutationObserver(() => {
        if (!document.querySelector('.hero')) return
        const sections = [...document.querySelectorAll('main > section[id^="showcase-"]')]
        window.initialShowcaseReady = sections.length === 5 && sections.every(section => section.querySelector('[data-my-component]'))
        firstMount.disconnect()
      })
      firstMount.observe(document.getElementById('app'), { childList: true, subtree: true })
      await import('/examples/vue/src/main.ts')
    } else {
      const reports = [],
        pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
      const assert = (condition, message) => {
        if (!condition) throw Error(message)
      }
      const until = async (check, message) => {
        const start = performance.now()
        while (!check()) {
          if (performance.now() - start > 10000) throw Error(message)
          await pause(30)
        }
      }
      let frame, doc, win
      const check = async (name, run) => {
        document.querySelector('#result').textContent = '运行中：' + name
        await run()
        reports.push({ name, passed: true })
      }
      const showcase = () => doc.querySelector('.showcase-layout')
      const nav = () => [...showcase().querySelectorAll('.site-nav a')]
      const sections = ['actions', 'controls', 'surfaces', 'feedback', 'scenarios']
      const waitShowcase = async () => {
        await until(() => showcase(), '长页未渲染')
        await until(
          () => sections.every((id) => showcase().querySelector('#showcase-' + id + ' [data-my-component]')),
          '长页示例控件未加载'
        )
      }
      document.querySelector('#run').onclick = async () => {
        document.querySelector('#run').disabled = true
        reports.length = 0
        try {
          frame = document.createElement('iframe')
          // 不带 hash：验证入口直接渲染长页。
          frame.src = '/tests/long-page.browser.html?frame=1'
          document.querySelector('#fixture').replaceChildren(frame)
          await until(() => frame.contentDocument?.querySelector('.showcase-layout'), '长页未加载')
          doc = frame.contentDocument
          win = frame.contentWindow

          await check('独立入口展示完整长页，不加载或挂载应用壳', async () => {
            await waitShowcase()
            assert(win.initialShowcaseReady === true, '长页首次挂载时留下了空分区')
            assert(win.location.hash === '', '长页启动改写了地址')
            assert(showcase().querySelector('.hero h1').textContent.includes('自然留白'), '缺少头图')
            assert(showcase().querySelectorAll('.sample-window,.float-chip').length === 3, '头图卡片缺失')
            for (const id of sections)
              assert(showcase().querySelector('#showcase-' + id), '缺少分区 ' + id)
            assert(
              !doc.querySelector('.demo-app, [data-demo-tabbar], .demo-catalog, [aria-label="返回组件目录"]'),
              '独立长页挂载了应用壳'
            )
            assert(
              !win.performance.getEntriesByType('resource').some(entry => entry.name.includes('/examples/tauri/ui/')),
              '独立长页加载了应用前端模块'
            )
          })

          await check('分类导航驱动选中状态与顶栏阴影', async () => {
            assert(nav().length === 5, '分类导航数量不对：' + nav().length)
            assert(showcase().querySelector('.native-example-link'), '缺少独立原生示例入口')
            nav()[1].click()
            await until(
              () => nav().find((item) => item.getAttribute('aria-current') === 'location')?.textContent === '交互控制',
              '分类选中状态未更新'
            )
            await pause(550)
            const header = showcase().querySelector('.masthead').getBoundingClientRect(),
              target = showcase().querySelector('#showcase-controls').getBoundingClientRect()
            assert(target.top >= header.bottom - 2 && target.top < header.bottom + 45, '分类被导航头遮挡')
            assert(showcase().querySelector('.masthead.scrolled'), '滚动后顶栏没有阴影')
            showcase().scrollTo({ top: 0, behavior: 'instant' })
            await pause(120)
            assert(!showcase().querySelector('.masthead.scrolled'), '回到顶部后顶栏阴影未移除')
            assert(win.location.hash === '', '锚点变成了页面跳转')
          })

          await check('分类导航从页面底部把长页带回分区顶部', async () => {
            showcase().scrollTo({ top: showcase().scrollHeight, behavior: 'instant' })
            await pause(120)
            const bottom = showcase().scrollTop
            assert(bottom > 1000, '长页没有可滚动内容')
            nav()[0].click()
            await until(() => {
              const header = showcase().querySelector('.masthead').getBoundingClientRect()
              const target = showcase().querySelector('#showcase-actions').getBoundingClientRect()
              return target.top >= header.bottom - 2 && target.top < header.bottom + 45
            }, '分区没有对齐导航头')
            assert(showcase().scrollTop < bottom / 2, '分类导航没有把长页带回分区顶部')
          })

          await check('独立页头可以切换主题并保留主题令牌', async () => {
            const toggle = doc.querySelector('.nav-theme button')
            assert(toggle, '独立页头缺少主题按钮')
            if (doc.documentElement.dataset.theme === 'dark') {
              toggle.click()
              await until(() => doc.documentElement.dataset.theme === 'light', '浅色模式未生效')
            }
            const style = () => win.getComputedStyle(showcase()).backgroundColor
            const before = style()
            toggle.click()
            await until(() => doc.documentElement.dataset.theme === 'dark', '暗黑模式没有生效')
            assert(style() !== before, '长页背景没有跟随主题令牌')
            toggle.click()
            await until(() => doc.documentElement.dataset.theme === 'light', '浅色模式未生效')
            assert(style() === before, '恢复亮色后背景没有还原')
          })

          await check('窄屏章节目录可直达第五章，小节链接停在固定栏下方', async () => {
            frame.style.width = '320px'
            const menu = showcase().querySelector('.chapter-menu')
            const trigger = menu.querySelector('summary')
            await until(() => trigger.getBoundingClientRect().width > 0, '窄屏目录未显示')
            trigger.click()
            assert(menu.open && menu.querySelectorAll('nav a').length === 5, '目录没有列出五章')
            menu.querySelector('nav a:last-child').click()
            await until(() => trigger.textContent === '完整示例', '窄屏目录未跟随当前章节')
            assert(!menu.open, '跳转后目录没有关闭')
            trigger.click()
            menu.querySelectorAll('nav a')[1].click()
            await until(() => trigger.textContent === '交互控制', '未跳到交互控制')
            showcase().querySelector('.section-links a[href="#showcase-control-dates"]').click()
            await until(() => {
              const bottom = showcase().querySelector('.masthead').getBoundingClientRect().bottom
              const top = showcase().querySelector('#showcase-control-dates').getBoundingClientRect().top
              return top >= bottom && top < bottom + 45
            }, '小节没有对齐导航头')
            frame.style.width = ''
          })

          await check('长页内容不注入模块脚本，示例图片可以从本站加载', async () => {
            assert(!showcase().querySelector('script[type="module"]'), '长页内容注入了模块脚本')
            const origin = win.location.origin
            assert(
              win.performance.getEntriesByType('resource').every((entry) => entry.name.startsWith(origin)),
              '长页请求了站外资源'
            )
            const sample = showcase().querySelector('img[src$="/lake.svg"]')
            assert(sample, '缺少湖景示例图片')
            await sample.decode()
          })

          await check('长页支持旧分类链接，应用路由地址也只打开长页', async () => {
            const previous = doc
            frame.src = '/tests/long-page.browser.html?frame=1&direct=1#/showcase#controls'
            await until(
              () => frame.contentDocument !== previous && frame.contentDocument?.querySelector('.showcase-layout'),
              '旧分类地址未打开长页'
            )
            doc = frame.contentDocument
            await until(() => nav()[1].getAttribute('aria-current') === 'location', '旧链接没有定位分类')
            const anchored = doc
            frame.src = '/tests/long-page.browser.html?frame=1&direct=2#/home'
            await until(
              () => frame.contentDocument !== anchored && frame.contentDocument?.querySelector('.showcase-layout'),
              '带旧应用地址时未打开长页'
            )
            assert(!frame.contentDocument.querySelector('.demo-app'), '旧应用地址打开了应用壳')
          })

          document.querySelector('#result').textContent = JSON.stringify(
            { passed: true, total: 7, reports },
            null,
            2
          )
        } catch (error) {
          document.querySelector('#result').textContent = JSON.stringify(
            { passed: false, error: String(error.stack || error), reports },
            null,
            2
          )
        } finally {
          document.querySelector('#run').disabled = false
        }
      }
    }
  </script>
</html>
