<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>App 页面容器回归</title><style>body{font:14px system-ui;margin:20px}iframe{width:390px;height:650px;border:1px solid #ddd}pre{white-space:pre-wrap}</style>
<h1>App 页面容器</h1><button id="run">运行检查</button><pre id="result">尚未运行</pre><div id="fixture"></div>
<script type="module">
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms)),params=new URLSearchParams(location.search);
if(params.has('frame')){
  if(params.get('frame')==='android'){
    Object.defineProperty(navigator,'userAgent',{value:'Android Tauri',configurable:true});window.isTauri=true;
    window.calls=[];window.__TAURI_INTERNALS__={invoke:async(command,args)=>{window.calls.push({command,args})}};
  }
  document.body.innerHTML='<div id="app"></div>';document.body.style.margin='0';document.documentElement.style.cssText='--nc-surface:#fff;--nc-text:#17191e;--nc-muted:#626776;--nc-primary:#2456ca;--nc-selected:#e8efff;--nc-border:#ddd';
  await import('/tests/native-app.fixture.ts');
}else{
  const reports=[],assert=(value,message)=>{if(!value)throw Error(message)},until=async(check,message='等待 App 超时')=>{const start=performance.now();while(!check()){if(performance.now()-start>12000)throw Error(message);await pause(20)}};
  let frame,doc,win;
  const load=async(mode='web',path='/fixture')=>{document.querySelector('#fixture').replaceChildren();frame=document.createElement('iframe');frame.src='?frame='+mode+'#'+path;document.querySelector('#fixture').append(frame);await until(()=>frame.contentDocument.querySelector('.nc-app'));doc=frame.contentDocument;win=frame.contentWindow;await pause(200)};
  const check=async(name,run)=>{document.querySelector('#result').textContent='运行中：'+name;await run();reports.push({name,passed:true})};
  const tab=value=>doc.querySelector('[data-app-tab="'+value+'"]');
  const select=async(value)=>{doc.querySelector('[aria-label="'+({home:'首页',messages:'消息',profile:'我的'}[value])+'"]').click();await until(()=>win.fixture.active.value===value);await pause(40)};
  document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
    await load();
    await check('默认只创建首个页面，自定义底栏通过插槽选择页面',async()=>{
      assert(Object.keys(win.mounts).join()==='home','提前创建了未访问页面');assert(!doc.querySelector('.nc-app > .nc-page-navbar')&&tab('home').querySelector('.nc-app-bar'),'顶部导航没有归属各个页面');await select('messages');assert(tab('messages').classList.contains('nc-app-view-active'),'底栏没有切换页面');assert(win.location.hash==='#/fixture','Tab 切换写入了路由记录');
    });
    await check('输入、计数、滚动与组件实例在切换及重复选择后完整保留',async()=>{
      const panel=tab('messages'),input=panel.querySelector('input');input.value='消息草稿';input.dispatchEvent(new win.Event('input',{bubbles:true}));panel.querySelector('[data-count]').click();panel.scrollTop=330;await pause(40);const top=panel.scrollTop;
      for(let index=0;index<5;index++){await select('home');await select('messages')}
      await select('messages');assert(tab('messages')===panel&&panel.scrollTop===top,'页面身份或滚动位置丢失');assert(input.value==='消息草稿'&&panel.querySelector('[data-count]').textContent==='messages · 1','页面状态丢失');assert(win.mounts.messages===1&&!win.unmounts.messages,'切换重新创建了组件');assert(tab('home').inert&&tab('home').getAttribute('aria-hidden')==='true','隐藏页面仍可交互或朗读');
      win.fixture.active.value='profile';await until(()=>tab('profile')?.classList.contains('nc-app-view-active'));await select('messages');
    });
    await check('独立页隐藏底栏并保留 Tab、底栏实例及各自状态',async()=>{
      const app=doc.querySelector('.nc-app'),bar=doc.querySelector('.nc-app-tabbar'),panel=tab('messages'),top=panel.scrollTop;doc.querySelector('[data-bar-count]').click();panel.querySelector('[data-open]').click();await until(()=>doc.querySelector('[data-test-detail="7"]'));
      assert(bar.hidden&&!bar.getBoundingClientRect().height,'独立页没有隐藏底栏');assert(win.fixture.active.value==='messages'&&tab('messages')===panel,'独立页改写了当前 Tab');
      doc.querySelector('[data-back]').click();await until(()=>!doc.querySelector('.nc-app-route-view'));assert(doc.querySelector('.nc-app')===app&&doc.querySelector('.nc-app-tabbar')===bar,'打开或返回详情重建 App 或底栏');assert(panel.scrollTop===top&&doc.querySelector('[data-bar-count]').textContent.endsWith('1'),'返回丢失滚动或自定义底栏状态');assert(win.events.includes('detail-leave'),'路由页面守卫没有执行');
    });
    await check('独立页之间返回保留各自的输入，直达详情可回到一级页面',async()=>{
      tab('messages').querySelector('[data-open]').click();await until(()=>doc.querySelector('[data-test-detail="7"]'));const input=doc.querySelector('[aria-label="detail-note"]'),detail=doc.querySelector('.nc-app-route-view');input.value='第一份详情';input.dispatchEvent(new win.Event('input',{bubbles:true}));detail.scrollTop=250;await pause(30);doc.querySelector('[data-next]').click();await until(()=>doc.querySelector('[data-test-detail="8"]'));doc.querySelector('[data-back]').click();await until(()=>doc.querySelector('[data-test-detail="7"]'));await pause(40);assert(doc.querySelector('[aria-label="detail-note"]').value==='第一份详情'&&doc.querySelector('.nc-app-route-view').scrollTop===250,'独立页缓存丢失输入或滚动状态');
      await load('web','/fixture/detail/7');assert(Object.keys(win.mounts).length===0,'直达独立页提前创建了 Tab');doc.querySelector('[data-back]').click();await until(()=>tab('home'));assert(win.location.hash==='#/fixture','独立页直达的回退地址错误');
    });
    await check('一级页面不执行返回，App 拒绝打开未配置的页面',async()=>{
      const hash=win.location.hash;await win.appNavigation.back();assert(win.location.hash===hash,'App 一级页面被返回操作关闭');let failed=false;try{await win.appNavigation.push('/unknown')}catch{failed=true}assert(failed,'未配置的页面仍可被 App 打开');
    });
    await check('Android 推入原生独立页时父容器和底栏配置保持不变',async()=>{
      await load('android');await until(()=>doc.querySelector('[data-native-layout="true"]'));await pause(300);const app=doc.querySelector('.nc-app'),count=win.calls.filter(call=>call.args?.surface?.kind==='layout').length;tab('home').querySelector('[data-open]').click();await until(()=>win.calls.some(call=>call.command==='plugin:native-components|push'));
      assert(win.calls.find(call=>call.command==='plugin:native-components|push').args.path.endsWith('#/fixture/detail/7'),'原生详情目标错误');assert(win.location.hash==='#/fixture'&&doc.querySelector('.nc-app')===app,'原生导航改变了父容器');await pause(100);assert(win.calls.filter(call=>call.args?.surface?.kind==='layout').length===count,'打开独立页无故更新父导航');
    });
    await check('显式隐藏底栏会撤掉原生底部区域，恢复后选中项与结构不变',async()=>{
      const bar=doc.querySelector('.nc-app-tabbar');await win.fixture.router.push({name:'app-test-detail',params:{id:'7'}});await until(()=>bar.hidden);await until(()=>win.calls.filter(call=>call.args?.surface?.kind==='layout').at(-1)?.args.surface.bottom===null);
      await win.fixture.router.replace('/fixture');await until(()=>!bar.hidden);await until(()=>win.calls.filter(call=>call.args?.surface?.kind==='layout').at(-1)?.args.surface.bottom?.modelValue==='home');assert(doc.querySelector('.nc-app-tabbar')===bar,'暂隐重建了底栏插槽');
    });
    await check('Android 页面自身的顶部导航与 Web 底栏可组合，自定义插槽保持可见可交互',async()=>{
      await load('android&custom');await until(()=>win.calls.some(call=>call.args?.surface?.kind==='appBar'&&call.args.surface.visible));assert(!doc.querySelector('.nc-app > .nc-page-navbar'),'App 仍提供顶部导航区域');
      const bar=doc.querySelector('.nc-app-tabbar'),button=doc.querySelector('[data-custom-tab="messages"]'),rect=button.getBoundingClientRect(),body=doc.querySelector('.nc-page-body').getBoundingClientRect();
      assert(rect.height>0&&body.bottom<=bar.getBoundingClientRect().top+1,'原生布局隐藏或覆盖了自定义底栏');assert(doc.elementFromPoint(rect.x+rect.width/2,rect.y+rect.height/2)===button,'自定义底栏无法命中');button.click();await until(()=>win.fixture.active.value==='messages');doc.querySelector('[data-bar-count]').click();
      await win.fixture.router.push('/fixture/detail/7');await until(()=>bar.hidden);await win.fixture.router.replace('/fixture');await until(()=>!bar.hidden);assert(doc.querySelector('.nc-app-tabbar')===bar&&doc.querySelector('[data-bar-count]').textContent.endsWith('1'),'自定义底栏状态没有保留');assert(!win.calls.some(call=>call.args?.surface?.kind==='layout'&&call.args.surface.bottom),'自定义底栏被误转换成原生控件');
    });
    document.querySelector('#result').textContent=JSON.stringify({passed:reports.length,total:8,reports},null,2);
  }catch(error){document.querySelector('#result').textContent=JSON.stringify({passed:reports.length,error:String(error.stack||error),reports},null,2)}finally{document.querySelector('#run').disabled=false}};
}
</script></html>
