<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>my-ui 原生核心与 Vue 适配回归</title>
<link rel="stylesheet" href="/lib/my-ui.css"><script src="/lib/my-ui.js"></script>
<style>main{padding:24px;max-width:900px;margin:auto}#fixture{margin:20px 0;max-width:360px;padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--card-background)}pre{white-space:pre-wrap;font:12px/1.6 monospace}</style>
<main><h1>原生核心与 Vue 适配</h1><button id="run" disabled>运行定向回归</button><div id="fixture"></div><pre id="result">尚未运行</pre></main>
<script type="module">
import {createApp,h,ref,nextTick} from 'vue'
import {Icon,Button,Input,Textarea,Select,Combobox,Form,FormField,Radio,RadioGroup,Checkbox,CheckboxGroup,TagGroup,Menu,Dialog,Popup,popup,Tabs,Collapse,CollapseItem,Segmented,ListRow,Progress} from '/vue/index.ts'
const {create}=MyUI,fixture=document.querySelector('#fixture'),results=[];
let owned=[],app;
const add=(name,props={},slots={})=>{const c=create(name,props,{slots});owned.push(c);fixture.append(c.element);return c;};
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const tick=async()=>{await nextTick();await nextTick();await new Promise(resolve=>requestAnimationFrame(resolve));};
const visible=selector=>[...document.querySelectorAll(selector)].find(node=>node.getClientRects().length&&!node.closest('[inert]'));
const assert=(value,message)=>{if(!value)throw Error(message);};
const cleanup=()=>{app?.unmount();app=undefined;owned.forEach(c=>c.destroy());owned=[];fixture.replaceChildren();};
const run=async(name,test)=>{try{cleanup();await test();results.push({name,pass:true});}catch(error){results.push({name,pass:false,error:error.stack});}finally{cleanup();}};
document.querySelector('#run').onclick=async()=>{
  results.length=0;document.querySelector('#result').textContent='运行中';document.documentElement.dataset.theme='light';
  await run('组件核心独立于示例主题，CSS 明暗切换与变量覆写直接生效', async () => {
    for (const name of ['applyTheme', 'createTheme', 'themeColors', 'themeStyles', 'defaultThemeOptions', 'contrastRatio']) assert(!(name in MyUI), name + ' 仍属于组件入口');
    const root = document.documentElement, previous = root.style.getPropertyValue('--primary');
    const button = add('Button', { label: 'CSS 配色' }).element;
    button.style.transition = 'none';
    try {
      assert(!previous, '组件自行向根节点写入配色');
      const light = getComputedStyle(button).backgroundColor;
      root.dataset.theme = 'dark'; await tick();
      assert(getComputedStyle(button).backgroundColor !== light, '未加载示例主题时，CSS 暗色失效');
      root.style.setProperty('--primary', '#123456');
      assert(getComputedStyle(button).backgroundColor === 'rgb(18, 52, 86)', '组件覆盖了用户的 CSS 变量');
    } finally {
      if (previous) root.style.setProperty('--primary', previous); else root.style.removeProperty('--primary');
      root.dataset.theme = 'light';
    }
  });
  await run('原生按钮、加载状态与内容尺寸',async()=>{let count=0;const c=add('Button',{label:'保存',onClick:()=>count++});c.element.click();assert(count===1,'原生点击丢失');c.update({loading:true});c.element.click();assert(count===1,'加载中仍触发业务回调');assert(c.element.textContent.includes('保存'),'加载时丢失原内容');});
  await run('原生按钮各变体的纯图标保持居中，动态文字与加载不挤偏内容', async () => {
    const centered = (node, button, label) => {
      const a = node.getBoundingClientRect(), b = button.getBoundingClientRect();
      assert(Math.abs(a.left + a.width / 2 - b.left - b.width / 2) < .6 && Math.abs(a.top + a.height / 2 - b.top - b.height / 2) < .6, label + ' 未居中');
    };
    for (const variant of ['primary', 'outline', 'text', 'icon', 'bare', 'round', 'link']) {
      const c = add('Button', { variant, icon: 'add' });
      await tick();
      centered(c.element.querySelector('svg'), c.element, variant + ' 纯图标');
      c.update({ label: '添加' });
      centered(c.element.querySelector('.my-button-content'), c.element, variant + ' 图文整体');
      c.update({ label: '', disabled: true });
      centered(c.element.querySelector('svg'), c.element, variant + ' 禁用图标');
      c.update({ disabled: false, loading: true });
      await tick();
      centered(c.element.querySelector('.my-button-content'), c.element, variant + ' 加载前内容');
      centered(c.element.querySelector('.my-button-loading > *'), c.element, variant + ' 加载指示');
    }
  });
  await run('Vue 按钮的内置、插槽与前后图标不受空标签或文字基线影响', async () => {
    const label = ref('');
    app = createApp({ setup: () => () => h('div', [
      h(Button, { variant: 'icon', icon: 'add', 'aria-label': '内置图标' }),
      h(Button, { variant: 'bare', 'aria-label': '插槽图标' }, () => h(Icon, { name: 'grid' })),
      h(Button, { variant: 'text' }, () => ['浮层菜单 ', h(Icon, { name: 'chevrons-up-down' })]),
      h(Button, { variant: 'outline' }, () => [h(Icon, { name: 'grid' }), '笔记操作 ', h(Icon, { name: 'chevrons-up-down' })]),
      h(Button, { icon: 'check' }, () => '带图标按钮'),
      h(Button, { variant: 'icon', icon: 'share', 'aria-label': '动态内容' }, () => label.value),
    ]) });
    app.mount(fixture);
    await tick();
    const buttons = [...fixture.querySelectorAll('button')];
    const verify = () => {
      for (const button of buttons) {
        const box = button.getBoundingClientRect(), content = button.querySelector('.my-button-content').getBoundingClientRect();
        assert(Math.abs(content.left + content.width / 2 - box.left - box.width / 2) < .6, '图文整体左右不对称');
        for (const icon of button.querySelectorAll('svg')) {
          const rect = icon.getBoundingClientRect();
          assert(Math.abs(rect.top + rect.height / 2 - box.top - box.height / 2) < .6, button.textContent + ' 图标上下偏移');
          if (!button.textContent.trim()) assert(Math.abs(rect.left + rect.width / 2 - box.left - box.width / 2) < .6, '空插槽把纯图标挤偏');
        }
      }
    };
    verify();
    label.value = '分享'; await tick(); verify();
    label.value = ''; await tick(); verify();
  });
  await run('Input 保留焦点/光标，显隐只由按钮触发，隐藏按钮不可见', async () => {
    let value;
    const c = add('Input', { label: '密码', value: 'secret', type: 'password', passwordToggle: true, clearable: true, onChange: next => value = next });
    const input = c.element.querySelector('input');
    input.focus(); input.setSelectionRange(2, 4); c.update({ hint: '提示' });
    assert(document.activeElement === input && input.selectionStart === 2, '更新丢失焦点或光标');
    input.click(); assert(input.type === 'password', '点击输入即泄露密码');
    c.element.querySelector('.my-password-toggle').click(); assert(input.type === 'text', '显隐按钮无效');
    c.element.querySelector('.my-clear-input').click(); assert(value === '' && input.value === '', '清空失败');
    c.update({ type: 'text' });
    assert(!c.element.querySelector('.my-password-toggle')?.getClientRects().length, '隐藏按钮仍可见');
  });
  await run('表单错误不撑高，文字与辅助关系正确',async()=>{const c=add('Input',{label:'邮箱',value:'x',hint:'输入说明'});const before=c.element.getBoundingClientRect().height;c.update({error:'这是一个需要隐藏超出部分的很长错误说明'.repeat(8)});assert(Math.abs(c.element.getBoundingClientRect().height-before)<.5,'错误撑高表单');const input=c.element.querySelector('input'),error=document.getElementById(input.getAttribute('aria-describedby'));assert(error?.getAttribute('role')==='alert'&&getComputedStyle(error).position==='absolute','错误关系或定位失效');});
  await run('竖排标题不激活输入、文本域或搜索选择，控件仍有辅助名称且可正常使用', async () => {
    for (const name of ['Input', 'Textarea', 'Combobox']) {
      const c = add(name, { label: name + ' 标题', value: '', options: [{ value: 'a', label: '选项甲' }] });
      await tick();
      const label = c.element.querySelector('.my-field-label'), input = c.element.querySelector('input:not([type="hidden"]),textarea');
      let clicks = 0;
      input.addEventListener('click', () => clicks++);
      label.click(); await tick();
      assert(clicks === 0 && document.activeElement !== input, name + ' 标题仍激活控件');
      assert(!label.hasAttribute('for') && input.getAttribute('aria-labelledby') === label.id, name + ' 辅助名称关联丢失');
      assert(input.getAttribute('aria-expanded') !== 'true', name + ' 标题展开了选项');
      c.exposed.focus();
      assert(document.activeElement === input, name + ' 无法直接聚焦');
      input.click();
      assert(clicks === 1 && (name !== 'Combobox' || input.getAttribute('aria-expanded') === 'true'), name + ' 输入区无法正常激活');
      c.exposed.close?.();
    }
    const slider = add('Slider', { label: '显示强度', value: 50, valueLabelDisplay: 'off' });
    let clicks = 0;
    slider.element.querySelector('input').addEventListener('click', () => clicks++);
    slider.element.querySelector('.my-range-heading > :first-child').click();
    assert(clicks === 0 && slider.element.querySelector('input').getAttribute('aria-label') === '显示强度', '滑块竖排标题仍激活控件或丢失名称');
  });
  await run('Select 上下箭头不旋转，标题不展开，实际按钮与键盘焦点仍可用', async () => {
    const c = add('Select', { label: '内容分类', value: 'a', options: [{ value: 'a', label: '效率优先' }, { value: 'b', label: '舒适优先' }] });
    const label = c.element.querySelector('.my-field-label'), button = c.element.querySelector('.my-select-trigger'), arrow = c.element.querySelector('.my-select-chevron');
    await tick();
    label.click(); await tick();
    assert(button.getAttribute('aria-expanded') === 'false' && document.activeElement !== button, 'Select 标题仍激活按钮');
    assert(button.getAttribute('aria-labelledby') === label.id, 'Select 丢失标题辅助名称');
    assert(getComputedStyle(arrow).transform === 'none', '上下箭头被旋转成横向');
    button.focus(); button.click(); await tick();
    assert(button.getAttribute('aria-expanded') === 'true' && visible('[role="listbox"]'), 'Select 按钮未同步菜单展开状态');
    assert(getComputedStyle(arrow).transform === 'none', '展开后上下箭头被旋转成横向');
  });
  await run('Vue 布局切换同步标题点击行为，横排标签与复选文字保留原生关联', async () => {
    const layout = ref('vertical');
    app = createApp({ setup: () => () => h('div', [
      h(Form, { layout: layout.value }, () => [
        h(Input, { id: 'title-input', label: '名称', modelValue: '' }),
        h(Textarea, { label: '简介', modelValue: '' }),
        h(Combobox, { label: '目的地', modelValue: '', options: [{ value: 'a', label: '杭州' }] }),
        h(Select, { label: '分类', modelValue: 'a', options: [{ value: 'a', label: '效率优先' }] }),
      ]),
      h(Checkbox, { label: '允许同步', modelValue: false }),
    ]) });
    app.mount(fixture); await tick();
    let clicks = 0;
    fixture.querySelectorAll('input,textarea,.my-select-trigger').forEach(input => input.addEventListener('click', () => clicks++));
    const labels = [...fixture.querySelectorAll('.my-field-label')];
    labels.forEach(label => label.click()); await tick();
    assert(clicks === 0 && !fixture.querySelector('[aria-expanded="true"]'), 'Vue 竖排标题激活了控件');
    for (const value of ['horizontal', 'inline', 'vertical']) {
      layout.value = value; await tick();
      const input = fixture.querySelector('#title-input'), label = document.getElementById(input.getAttribute('aria-labelledby'));
      const previous = clicks;
      label.click();
      assert(clicks === previous + (value === 'vertical' ? 0 : 1), value + ' 标题点击行为未同步');
    }
    const choice = fixture.querySelector('.my-choice-control');
    choice.querySelector('.my-choice-label').click();
    assert(choice.querySelector('input').checked, '复选框文字不再可以切换选中态');
  });
  await run('独立 Radio、Checkbox 和分组只更新对应值',async()=>{let value;const c=add('RadioGroup',{label:'方案',value:'one',options:[{value:'one',label:'一'},{value:'two',label:'二'}],onChange:v=>value=v});await tick();const inputs=c.element.querySelectorAll('input');assert(inputs[0].checked&&!inputs[1].checked,'初始单选错误');assert(inputs[0].name===inputs[1].name,'原生组名称不一致');inputs[1].click();assert(value==='two'&&inputs[1].checked&&!inputs[0].checked,'单选状态未同步');const checkbox=add('Checkbox',{value:false,label:'保存',indeterminate:true,onChange:v=>value=v});checkbox.element.querySelector('input').click();assert(value===true&&!checkbox.element.querySelector('input').indeterminate,'复选或半选清理失败');});
  await run('Tag 单选、多选状态保留类型',async()=>{let value;const c=add('TagGroup',{value:[],label:'兴趣',options:[{value:'a',label:'甲'},{value:'b',label:'乙'}],onChange:v=>value=v});c.element.querySelectorAll('[role="button"],button')[0].click();assert(Array.isArray(value)&&value[0]==='a','标签多选失败');});
  await run('Slider 限制刻度、范围、缓冲三段及键盘',async()=>{let value;const c=add('Slider',{label:'温度',value:20,min:0,max:100,step:null,marks:[{value:0},{value:20},{value:37},{value:100}],buffer:80,onChange:v=>value=v});const input=c.element.querySelector('input');input.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true}));assert(value===37&&Number(input.value)===37,'指定刻度键盘失效');const range=add('Slider',{label:'范围',value:[20,70],marks:true,step:10});assert(range.element.querySelectorAll('input').length===2,'范围滑块缺失');assert(c.element.querySelector('.my-progress-buffer')&&!c.element.querySelector('.my-progress-buffer').hidden,'缓冲层缺失');});
  await run('原生 Combobox 提交标签对应值，搜索可用',async()=>{let value;const c=add('Combobox',{label:'城市',value:'hz',clearable:true,options:[{value:'hz',label:'杭州'},{value:'sh',label:'上海'}],onChange:v=>value=v});const input=c.element.querySelector('input');assert(input.value==='杭州','显示成原始 value');input.focus();await tick();input.value='上';input.dispatchEvent(new InputEvent('input',{bubbles:true}));await tick();const options=[...document.querySelectorAll('[role="option"]')];assert(options.length===1&&options[0].textContent.includes('上海'),'搜索筛选失败');options[0].click();await tick();assert(value==='sh'&&input.value==='上海','选择结果错误');});
  await run('原生菜单重开、键盘焦点循环和外部按下淡出',async()=>{const button=document.createElement('button');button.textContent='打开';const c=add('Menu',{options:[{value:'a',label:'甲'},{value:'b',label:'乙'}]},{default:button});await tick();button.click();await tick();const panel=visible('.my-floating-panel');assert(panel,'菜单未打开');assert(panel.contains(document.activeElement),'菜单初始焦点未进入');document.activeElement.dispatchEvent(new KeyboardEvent('keydown',{key:'Tab',bubbles:true,cancelable:true}));assert(panel.contains(document.activeElement),'Tab 逃出菜单');document.querySelector('#run').dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,isPrimary:true,button:0,pointerType:'mouse'}));assert(panel.closest('[inert]'),'关闭未立即隔离交互');assert(panel.isConnected,'没有保留淡出动画');await pause(230);button.click();await tick();assert(visible('.my-floating-panel'),'再次打开失败');});
  await run('菜单拖动滚动条范围不误判外部',async()=>{const button=document.createElement('button');button.textContent='打开';add('Menu',{options:Array.from({length:30},(_,i)=>({value:String(i),label:'条目 '+i}))},{default:button});await tick();button.click();await tick();const panel=visible('.my-floating-panel');panel.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,isPrimary:true,button:0,pointerType:'mouse'}));assert(!panel.closest('[inert]'),'窗口滚动条被当作外部');});
  await run('原生 Popup 无需宿主，先关闭后返回且不重复覆盖结果',async()=>{const promise=MyUI.popup.showAlert({title:'确认保存',message:'测试',confirmText:'保存'});await tick();const overlay=visible('.my-overlay');assert(overlay,'无需宿主未创建弹层');overlay.querySelector('.my-popup-actions button:last-child').click();assert(overlay.inert,'回调前未隔离');assert(await promise===true,'确认结果错误');await pause(280);assert(!overlay.isConnected,'退出后未释放');});
  await run('Sheet 任意 DOM 内容与结果，焦点返回触发器',async()=>{const trigger=document.querySelector('#run');trigger.focus();const handle=MyUI.popup.showSheet({title:'任意内容',content:({close})=>{const button=document.createElement('button');button.textContent='完成';button.onclick=()=>close('done');return button;}});await tick();const overlay=visible('.my-sheet-overlay');assert(overlay?.textContent.includes('完成'),'自定义内容缺失');[...overlay.querySelectorAll('button')].find(node=>node.textContent==='完成').click();assert(await handle.closed==='done','内容关闭结果丢失');assert(document.activeElement===trigger,'关闭未恢复焦点');await pause(280);});
  await run('ListRow 整行开关与 Choices 列表维持原生选择',async()=>{let toggled;const row=add('ListRow',{title:'通知',toggle:true,value:false,onChange:value=>toggled=value});row.element.click();assert(toggled===true&&row.element.querySelector('input').checked,'整行开关重复切换');let selected;const list=add('Choices',{label:'同步',type:'checkbox',list:true,value:['a'],options:[{value:'a',label:'甲'},{value:'b',label:'乙'}],onChange:value=>selected=value});list.element.querySelectorAll('input')[1].click();assert(selected.join(',')==='a,b','Choices 多选丢失勾选');assert(getComputedStyle(list.element.querySelector('legend')).display==='none','列表重复显示标题');});
  await run('Vue 移除外部 class、CSS 变量与原生属性',async()=>{const custom=ref(true);app=createApp({setup:()=>()=>h(Input,{modelValue:'示例',label:'外观',class:custom.value?'custom-input':undefined,style:custom.value?{'--input-radius':'3px'}:{},'data-custom':custom.value?'yes':undefined})});app.mount(fixture);await tick();const root=fixture.querySelector('.my-input'),input=fixture.querySelector('input');assert(root.classList.contains('custom-input'),'初始 class 缺失');custom.value=false;await tick();assert(!root.classList.contains('custom-input')&&!root.style.getPropertyValue('--input-radius')&&!input.hasAttribute('data-custom'),'外部属性留下残留');});
  await run('原生 Popup 内容只构建一次，子组件随窗口释放',async()=>{let builds=0,menu;const button=document.createElement('button');button.textContent='子菜单';const handle=MyUI.popup.showSheet({title:'生命周期',content:()=>{builds++;menu=create('Menu',{options:[{value:'a',label:'甲'}]},{slots:{default:button}});return menu;}});await tick();handle.close();await handle.closed;assert(builds===1,'关闭时重新构建内容');await pause(320);menu.exposed.show(button);await tick();assert(!visible('.my-floating-panel'),'已释放组件重新创建窗口');});
  await run('Vue v-model、插槽内容和原生节点保持一致',async()=>{const value=ref('旧值');app=createApp({setup:()=>()=>h(Input,{modelValue:value.value,'onUpdate:modelValue':v=>value.value=v,label:'Vue 名称',clearable:true},{prefix:()=>h('span','¥')})});app.mount(fixture);await tick();const input=fixture.querySelector('input');assert(input&&fixture.textContent.includes('¥'),'Vue 内容插槽丢失');input.value='新值';input.dispatchEvent(new InputEvent('input',{bubbles:true}));await tick();assert(value.value==='新值','Vue 双向同步失败');value.value='外部更新';await tick();assert(input===fixture.querySelector('input')&&input.value==='外部更新','外部更新重建原生输入');});
  await run('Vue Form 上下文与 CheckboxGroup 插槽自由组合',async()=>{const selection=ref(['a']);app=createApp({setup:()=>()=>h(Form,{layout:'horizontal'},()=>[h(FormField,{label:'内容',group:true},()=>h(CheckboxGroup,{label:'偏好',modelValue:selection.value,'onUpdate:modelValue':v=>selection.value=v},()=>[h(Checkbox,{value:'a',label:'甲'}),h(Checkbox,{value:'b',label:'乙'})]))])});app.mount(fixture);await tick();const inputs=fixture.querySelectorAll('input');assert(inputs[0].checked&&!inputs[1].checked,'Vue 插槽组初态错误');inputs[1].click();await tick();assert(selection.value.join(',')==='a,b','Vue 插槽组未继承状态');assert(fixture.querySelector('.my-form-field').classList.contains('my-horizontal'),'布局未从 DOM 继承');});
  await run('Vue Tabs 与 Collapse 的 scoped slot、焦点、内容状态',async()=>{const tab=ref('one'),open=ref('one');app=createApp({setup:()=>()=>h('div',[h(Tabs,{label:'页签',modelValue:tab.value,options:[{value:'one',label:'甲'},{value:'two',label:'乙'}],'onUpdate:modelValue':v=>tab.value=v},{default:({value})=>h('p','当前：'+value)}),h(Collapse,{modelValue:open.value,'onUpdate:modelValue':v=>open.value=v},()=>h(CollapseItem,{value:'one',title:'内容'},()=>h('input',{defaultValue:'保留'})))])});app.mount(fixture);await tick();fixture.querySelectorAll('[role="tab"]')[1].click();await tick();assert(tab.value==='two'&&fixture.textContent.includes('当前：two'),'scoped slot 页签切换失败');const input=fixture.querySelector('.my-collapse-content input');input.value='仍保留';fixture.querySelector('.my-collapse-trigger').click();await tick();assert(input.closest('[inert]'),'折叠时未禁止焦点');fixture.querySelector('.my-collapse-trigger').click();await tick();assert(input.value==='仍保留','折叠丢失内容状态');});
  await run('Vue Popup 自定义内容保持响应性与关闭结果',async()=>{app=createApp({setup:()=>()=>h(Popup)});app.mount(fixture);const value=ref(0);const handle=popup.showSheet({title:'Vue 内容',content:({close})=>h('button',{onClick:()=>{value.value++;if(value.value===2)close(value.value);}},'次数 '+value.value)});await tick();let button=[...visible('.my-sheet-overlay').querySelectorAll('button')].find(node=>node.textContent==='次数 0');button.click();await tick();assert(button.textContent==='次数 1','Vue 内容不响应');button.click();assert(await handle.closed===2,'Vue 内容结果丢失');await pause(280);});
  // 样式迁移必须检查浏览器实际尺寸，单纯验证状态和值无法发现 SVG 撑大布局。
  await run('内部图标具备尺寸标记，开关列表和分段布局不被 SVG 撑开', async () => {
    add('Segmented', { value: 'a', options: [{ value: 'a', label: '舒适', icon: 'sparkle' }, { value: 'b', label: '均衡', icon: 'sliders' }] });
    const row = add('ListRow', { title: '自动更新', description: '在后台保持内容最新', toggle: true, value: true });
    add('Navigation', { value: 'home', options: [{ value: 'home', label: '首页', icon: 'home' }, { value: 'user', label: '我的', icon: 'user' }] });
    await tick();
    for (const icon of fixture.querySelectorAll('.my-icon:not([hidden])')) {
      const box = icon.getBoundingClientRect();
      assert(icon.hasAttribute('data-my-icon') && box.width >= 15.9 && box.width <= 24.1 && box.height <= 24.1, '内部图标缺失样式或超过设计尺寸：' + box.width + ' × ' + box.height);
    }
    assert(row.element.querySelector('.my-trailing-icon').hasAttribute('hidden'), '开关列表仍显示默认箭头');
    assert(row.element.getBoundingClientRect().height < 100, '开关列表被图标撑高');
    assert(fixture.querySelector('.my-segmented').getBoundingClientRect().height < 60, '分段选择被图标撑高');
    const group = add('CellGroup', { options: [{ value: 'a', label: '第一项' }, { value: 'b', label: '第二项' }, { value: 'c', label: '第三项' }] });
    const rows = [...group.element.querySelectorAll('.my-list-row')];
    assert(getComputedStyle(rows[0]).paddingTop === '16px' && getComputedStyle(rows[2]).paddingBottom === '16px', '封装后丢失首尾内边距');
    assert(getComputedStyle(rows[1].parentElement, '::before').content === 'none' && parseFloat(getComputedStyle(rows[1], '::before').borderTopWidth) > 0, '占位节点与列表项重复绘制分割线');
  });
  await run('Progress 在线形与环形之间切换时正确隐藏 SVG，并保留自定义尺寸', async () => {
    const progress = add('Progress', { value: 64 });
    await tick();
    const ring = progress.element.querySelector('.my-progress-ring');
    assert(ring.hasAttribute('hidden') && !ring.getClientRects().length, '线形进度混入环形 SVG');
    assert(progress.element.getBoundingClientRect().height <= 24, '线形进度高度异常');
    progress.update({ type: 'circle' }, { style: '--progress-size:64px' });
    await tick();
    assert(!ring.hasAttribute('hidden') && Math.abs(ring.getBoundingClientRect().width - 64) < 1, '环形尺寸或显示失效');
    assert(!progress.element.querySelector('.my-progress-track').getClientRects().length, '环形进度仍显示线形轨道');
    progress.update({ type: 'line' });
    assert(!ring.getClientRects().length && progress.element.getBoundingClientRect().height <= 24, '切回线形仍留下大环');
  });
  await run('Vue 组合在明暗主题下保持图标、分段和列表尺寸', async () => {
    app = createApp({ setup: () => () => h('div', [
      h(Segmented, { label: '浏览模式', modelValue: 'a', options: [{ value: 'a', label: '舒适', icon: 'sparkle' }, { value: 'b', label: '均衡', icon: 'sliders' }] }),
      h(ListRow, { title: '自动更新', description: '在后台保持内容最新', toggle: true, modelValue: true }),
      h(Progress, { value: 64 }),
    ]) });
    app.mount(fixture);
    for (const mode of ['light', 'dark']) {
      document.documentElement.dataset.theme = mode;
      await tick();
      assert(fixture.querySelector('.my-segmented').getBoundingClientRect().height < 60, mode + ' 分段高度错误');
      assert(fixture.querySelector('.my-list-row').getBoundingClientRect().height < 100, mode + ' 列表高度错误');
      assert(!fixture.querySelector('.my-progress-ring').getClientRects().length, mode + ' 环形 SVG 未隐藏');
      for (const icon of fixture.querySelectorAll('.my-icon:not([hidden])')) assert(icon.getBoundingClientRect().width <= 24, mode + ' 图标尺寸错误');
    }
  });
  await run('清空、密码显隐和自定义后缀由最后一项接管边距，隐藏操作不留下空位', async () => {
    const input = add('Input', { value: '示例', type: 'password', clearable: true, passwordToggle: true });
    const actions = input.element.querySelector('.my-input-actions');
    const eye = actions.querySelector('.my-password-toggle');
    assert(actions.children.length === 2 && actions.lastElementChild === eye, '隐藏后缀仍占据末项位置');
    const right = eye.getBoundingClientRect().right;
    actions.querySelector('.my-clear-input').click();
    assert(actions.children.length === 1 && actions.lastElementChild === eye, '清空后保留空操作');
    assert(Math.abs(eye.getBoundingClientRect().right - right) < 1, '清空后眼睛右移或丢失末项边距');
    input.update({ type: 'text', value: '示例', passwordToggle: false });
    assert(actions.children.length === 1 && actions.firstElementChild.classList.contains('my-clear-input'), '仅清空时没有接管末项');
    const box = input.element.querySelector('.my-input-box').getBoundingClientRect();
    const icon = actions.querySelector('svg').getBoundingClientRect();
    assert(box.right - icon.right >= 13 && box.right - icon.right < 16, '清空图标贴到输入框边缘');
  });
  await run('菜单叶项无多余箭头，子菜单每行只保留一个方向图标', async () => {
    const button = document.createElement('button'); button.textContent = '打开菜单';
    add('Menu', { options: [{ value: 'open', label: '查看笔记', icon: 'image' }, { value: 'move', label: '移动到', children: [{ value: 'daily', label: '日常' }] }] }, { default: button });
    button.click(); await tick();
    const leaf = document.querySelector('[data-menu-item="open"]');
    const branch = document.querySelector('[data-menu-item="move"]');
    assert(!leaf.querySelector('.my-trailing-icon').getClientRects().length, '叶项保留了默认右箭头');
    const arrows = [...branch.querySelectorAll('.my-trailing-icon,.my-menu-chevron')].filter(node => node.getClientRects().length);
    assert(arrows.length === 1 && arrows[0].getBoundingClientRect().width <= 20, '子菜单出现重复或超大箭头');
  });
  await run('Tooltip 矩形背景使用有效 SVG 遮罩，明暗主题都有可读文字', async () => {
    const tooltip = add('Tooltip', { content: '完整的数值提示', arrow: true }, { default: '触发区域' });
    tooltip.element.focus(); await tick();
    const panel = visible('.my-tooltip-panel');
    const mask = getComputedStyle(panel, '::before').maskImage;
    assert(mask.includes('www.w3.org/2000/svg') && !mask.includes('my-w3'), 'Tooltip 背景遮罩命名空间损坏');
    assert(panel.querySelector('[role="tooltip"]').textContent === '完整的数值提示', 'Tooltip 文字丢失');
    for (const mode of ['light', 'dark']) {
      document.documentElement.dataset.theme = mode; await tick();
      const color = getComputedStyle(panel.querySelector('[role="tooltip"]')).color;
      assert(color === (mode === 'dark' ? 'rgb(0, 0, 0)' : 'rgb(255, 255, 255)'), mode + ' Tooltip 文字未反色');
    }
  });
  await run('双按钮弹窗保持透明常态，短分割线居中且底部留白可点击', async () => {
    const closed = MyUI.popup.showAlert({ title: '清除缓存？', message: '这里只验证布局。', confirmText: '清除' });
    await tick();
    const overlay = visible('.my-overlay');
    const actions = overlay.querySelector('.my-popup-actions');
    const separator = getComputedStyle(actions, '::after');
    const button = actions.querySelector('button');
    const style = getComputedStyle(button);
    assert(Math.abs(parseFloat(separator.left) - actions.getBoundingClientRect().width / 2) < 1, '按钮分割线不在正中');
    // 175% 缩放下，1px 边框的计算值可能被取整到一个物理像素，不能用严格相等。
    assert(Math.abs(parseFloat(separator.height) - 20) < 0.1 && parseFloat(separator.borderInlineStartWidth) > 0 && parseFloat(separator.borderInlineStartWidth) <= 1.01, '按钮分割线尺寸错误');
    assert(style.backgroundColor === 'rgba(0, 0, 0, 0)', '按钮常态误加背景');
    assert(parseFloat(style.paddingBottom) >= 24, '底部留白没有纳入操作区');
    button.click(); assert(await closed === false, '底部取消操作未生效'); await pause(280);
  });
  document.querySelector('#result').textContent=JSON.stringify({pass:results.every(item=>item.pass),total:results.length,results},null,2);
};
document.querySelector('#run').disabled = false;
</script></html>
