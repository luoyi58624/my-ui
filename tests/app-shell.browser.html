<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web 应用壳与原生页面导航回归</title><style>body{font:14px system-ui;margin:20px}iframe{width:390px;height:844px;border:1px solid #ddd}pre{white-space:pre-wrap}</style>
<button id="run">运行检查</button><pre id="result">尚未运行</pre><div id="fixture"></div>
<script type="module">
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms)),mode=new URLSearchParams(location.search).get('frame');
if(mode){
 if(mode==='android'){
  Object.defineProperty(navigator,'userAgent',{value:'Android Tauri',configurable:true});window.isTauri=true;window.calls=[];
  window.__TAURI_INTERNALS__={invoke:async(command,args)=>{window.calls.push({command,args,content:!!document.querySelector('.demo-detail input'),title:document.querySelector('[data-demo-title]')?.textContent});if(command==='plugin:app|supports_multiple_windows')return true}};
 }
 document.body.innerHTML='<div id="app"></div>';const base=document.createElement('base');base.href='/examples/tauri/ui/';document.head.append(base);await import('/examples/tauri/ui/src/main.ts');
}else{
 const reports=[],assert=(value,message)=>{if(!value)throw Error(message)},until=async(check,message='等待应用壳超时')=>{const start=performance.now();while(!check()){if(performance.now()-start>15000)throw Error(message);await pause(20)}};
 let frame,doc,win;
 const current=()=>doc.querySelector('.demo-page:not([inert])'),bar=()=>doc.querySelector('[data-demo-tabbar]');
 const load=async(mode='web',path='/home',child=false)=>{frame=document.createElement('iframe');frame.src='?frame='+mode+(child?'&pageWindow=1':'')+'#'+path;document.querySelector('#fixture').replaceChildren(frame);await until(()=>frame.contentDocument?.querySelector('.demo-app [data-demo-title]'));doc=frame.contentDocument;win=frame.contentWindow;await pause(150)};
 const route=async(path)=>{win.location.hash=path;await until(()=>win.location.hash==='#'+path);await pause(80)};
 const select=async(value)=>{const labels={home:'首页',native:'应用',messages:'消息',settings:'设置'};[...bar().querySelectorAll('button')].find(node=>node.textContent.trim()===labels[value]).click();await until(()=>current()?.dataset.demoPage===value);await pause(20)};
 const open=async(id)=>{current().querySelector('[data-demo-link="'+id+'"]').click();await until(()=>current()?.dataset.demoPage==='example/'+id&&current().querySelector('[data-example]'));await pause(30)};
 const back=async(expected='/home')=>{doc.querySelector('.demo-route-pages [aria-label^="返回"]').click();await until(()=>win.location.hash==='#'+expected);await pause(90)};
 const check=async(name,run)=>{document.querySelector('#result').textContent='运行中：'+name;await run();reports.push({name,passed:true})};
 document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
  await load();
  await check('主壳使用 Web AppBar 与 Tabbar，栏目首次访问才挂载',async()=>{
   assert(doc.querySelector('.demo-header .my-app-bar')&&bar().classList.contains('my-tabbar'),'没有使用 my-ui 导航组件');assert(doc.querySelectorAll('.demo-tab-pages .demo-view').length===1,'首屏提前创建其他栏目');assert(!doc.querySelector('[data-native-layout],.nc-page,.nc-tabs,.nc-app'),'仍挂载原生 UI 容器');
  });
  await check('连续 40 次 Tab 切换保留实例、计数、滚动与历史长度',async()=>{
   const shell=doc.querySelector('.demo-app'),footer=bar(),home=current(),length=win.history.length;home.scrollTop=550;await pause(30);await select('messages');const messages=current(),counter=[...messages.querySelectorAll('button')].find(node=>node.textContent.includes('点一下'));counter.click();await pause(20);
   for(let round=0;round<10;round++)for(const tab of ['settings','native','home','messages'])await select(tab);
   assert(current()===messages&&counter.textContent.includes('1'),'切换丢失栏目状态');await select('home');assert(current()===home&&home.scrollTop===550,'首页滚动被重置');assert(win.history.length===length&&doc.querySelector('.demo-app')===shell&&bar()===footer,'切换累积历史或重建壳');assert(doc.querySelectorAll('.demo-tab-pages .demo-view').length===4,'切换重复创建栏目');
  });
  await check('详情到代码再返回保留输入、实例和滚动，底栏只在主栏目显示',async()=>{
   await open('input');const detail=current(),input=detail.querySelector('input');input.value='代码往返保留内容';input.dispatchEvent(new win.Event('input',{bubbles:true}));detail.scrollTop=150;await pause(30);const top=detail.scrollTop;assert(win.getComputedStyle(bar()).display==='none','详情未隐藏主底栏');await route('/code/input');await until(()=>doc.querySelector('.code-page code'));await back('/example/input');assert(current()===detail&&input.value==='代码往返保留内容'&&detail.scrollTop===top,'代码页返回丢失详情');await back();assert(win.getComputedStyle(bar()).display!=='none'&&current().scrollTop===550,'返回目录丢失状态');
  });
  await check('详情缓存超过 12 页后释放最早页面',async()=>{
   await open('input');const previous=current().querySelector('input');await back();for(const id of ['button','tag','card','identity','image','shadows','switch','slider','selection','list','feedback','menu','tabbar']){await route('/example/'+id);await until(()=>current()?.dataset.demoPage==='example/'+id&&current().querySelector('[data-example]'))}await route('/example/input');await until(()=>current()?.querySelector('input'));assert(current().querySelector('input')!==previous,'超过上限仍无限缓存');assert(doc.querySelectorAll('.demo-detail').length===1,'非活动详情仍参与布局');
  });
  await check('Android 保留原生 push，新页面内部使用 Web UI',async()=>{
   await load('android');current().querySelector('[data-demo-link="input"]').click();await until(()=>win.calls.some(call=>call.command==='plugin:native-components|push'));const push=win.calls.find(call=>call.command==='plugin:native-components|push');assert(push.args.path.endsWith('#/example/input')&&push.args.title==='Input / Select','原生页面地址或标题错误');assert(win.location.hash==='#/home'&&current().dataset.demoPage==='home','原生 push 替换当前窗口路由');assert(!win.calls.some(call=>['plugin:native-components|create','plugin:native-components|update'].includes(call.command)),'仍通过 IPC 创建原生控件');
  });
  await check('Android 子页等实际内容挂载后 ready，返回关闭当前原生页面',async()=>{
   await load('android','/example/input',true);await until(()=>current()?.querySelector('input'));await until(()=>win.calls.some(call=>call.command==='plugin:native-components|page_ready'));const ready=win.calls.filter(call=>call.command==='plugin:native-components|page_ready');assert(ready.every(call=>call.content&&call.title==='Input / Select'),'空根节点提前放行首帧');assert(win.getComputedStyle(bar()).display==='none'&&doc.querySelectorAll('.demo-tab-pages .demo-view').length===0,'子页创建无关主栏目');doc.querySelector('[aria-label="返回上一页"]').click();await until(()=>win.calls.some(call=>call.command==='plugin:native-components|back'));
  });
  document.querySelector('#result').textContent=JSON.stringify({passed:reports.length,total:6,reports},null,2);
 }catch(error){document.querySelector('#result').textContent=JSON.stringify({passed:reports.length,error:String(error.stack||error),reports},null,2)}finally{document.querySelector('#run').disabled=false}};
}
</script></html>
