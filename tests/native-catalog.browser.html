<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>原生组件目录与示例检查</title><style>body{font:14px system-ui;margin:20px}iframe{width:390px;height:650px;border:1px solid #ddd}pre{white-space:pre-wrap}</style>
<h1>原生组件目录与示例</h1><button id="run">运行检查</button><pre id="result">尚未运行</pre><div id="fixture"></div>
<script type="module">
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
if(new URLSearchParams(location.search).has('frame')){
  document.body.innerHTML='<div id="app"></div>';
  await import('/example/src/main.ts').catch(error=>{document.body.textContent=error.stack;throw error});
}else{
  const reports=[],assert=(value,message)=>{if(!value)throw Error(message)},until=async(check,message='等待超时')=>{const start=performance.now();while(!check()){if(performance.now()-start>10000)throw Error(message);await pause(30)}};
  let frame,doc,win;
  const load=async hash=>{document.querySelector('#fixture').replaceChildren();frame=document.createElement('iframe');frame.src='?frame=1#'+hash;document.querySelector('#fixture').append(frame);await until(()=>frame.contentDocument?.querySelector('.nc-app-bar'));doc=frame.contentDocument;win=frame.contentWindow;await pause(120)};
  const catalog=()=>doc.querySelector('[data-demo-page="native"]:not([inert])');
  const demo=()=>doc.querySelector('[data-component-demo]');
  const button=(root,text)=>[...root.querySelectorAll('button')].find(node=>node.textContent.trim()===text);
  const open=async(id,selector)=>{catalog().querySelector('[data-demo-link="'+id+'"]').click();await until(()=>doc.querySelector(selector),'没有进入 '+id);await pause(60)};
  const back=async()=>{doc.querySelector('[aria-label="返回原生组件"],.refresh-demo [aria-label="返回"]').click();await until(()=>catalog(),'没有返回原生目录');await pause(100)};
  const check=async(name,run)=>{document.querySelector('#result').textContent='运行中：'+name;await run();reports.push({name,passed:true})};
  document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;reports.length=0;try{
    await load('/native');
    await check('第二导航集中展示全部原生组件，首页保留普通组件与纯 HTML 示例',async()=>{
      assert([...doc.querySelectorAll('.demo-app .nc-app-tabbar button')].map(node=>node.textContent.trim()).join(',')==='首页,原生,消息,设置','导航名称错误');
      assert([...catalog().querySelectorAll('[data-demo-link]')].map(node=>node.dataset.demoLink).join(',')==='native-app,native-app-bar,native-tabbar,native-tabs,page-refresh,native-navigation','原生目录缺项或顺序错误');
      const nav=doc.querySelector('.demo-app .nc-app-tabbar');nav.querySelector('[aria-label="首页"]').click();await until(()=>doc.querySelector('[data-demo-page="home"]:not([inert])'));const home=doc.querySelector('[data-demo-page="home"]');assert(!home.querySelector('[data-demo-link="native-navigation"]')&&home.querySelector('[data-demo-link="native-html"]'),'目录归属不正确');nav.querySelector('[aria-label="原生"]').click();await until(()=>catalog());
    });
    await check('AppBar 示例支持操作与对齐切换，返回恢复原生目录位置和焦点',async()=>{
      const parent=catalog();parent.scrollTop=90;const top=parent.scrollTop;await open('native-app-bar','[data-component-demo="app-bar"]');
      assert(demo().querySelector('.nc-app-bar'),'没有真实组件');button(demo(),'标题靠左').click();await pause(40);assert(button(demo(),'标题居中'),'标题对齐没有更新');
      doc.querySelector('[aria-label="页面操作"]').click();await pause(40);assert(demo().textContent.includes('已点击页面操作'),'页面操作未回传');await back();
      assert(catalog()===parent&&catalog().scrollTop===top,`返回目录实例 ${catalog()===parent}，滚动 ${catalog().scrollTop}/${top}`);assert(doc.activeElement?.dataset.demoLink==='native-app-bar','返回未恢复入口焦点');
    });
    await check('Tabbar 与 Tabs 各自维护状态，切换和重新进入都能保留',async()=>{
      await open('native-tabbar','[data-component-demo="tabbar"]');demo().querySelector('[aria-label="收藏"]').click();await pause(40);button(demo(),'点一下 · 0').click();await pause(40);assert(button(demo(),'点一下 · 1'),'底栏示例未更新');await back();
      await open('native-tabs','[data-component-demo="tabs"]');demo().querySelector('[aria-label="收藏"]').click();await pause(40);assert(button(demo(),'点一下 · 0'),'不同示例串用了计数');button(demo(),'点一下 · 0').click();await pause(40);
      demo().querySelector('[aria-label="动态"]').click();await pause(40);demo().querySelector('[aria-label="收藏"]').click();await pause(40);assert(button(demo(),'点一下 · 1'),'Tabs 切换丢失状态');await back();
      await open('native-tabbar','[data-component-demo="tabbar"]');assert(button(demo(),'点一下 · 1')&&demo().querySelector('[aria-label="收藏"]').getAttribute('aria-current')==='page','返回重建了底栏示例');await back();
    });
    await check('Page 下拉刷新从原生目录打开，完成更新后返回原入口',async()=>{
      await open('page-refresh','.refresh-demo');button(doc.querySelector('.refresh-demo'),'刷新动态').click();await until(()=>doc.querySelector('.refresh-demo').textContent.includes('已更新 1 次'),'刷新未完成');await back();
      assert(doc.activeElement?.dataset.demoLink==='page-refresh','Page 返回没有恢复入口');
    });
    await check('窄屏原生目录与演示页没有横向溢出',async()=>{
      frame.style.width='320px';await pause(100);assert(catalog().scrollWidth<=catalog().clientWidth+1,'原生目录横向溢出');
      for(const [id,kind]of[['native-app-bar','app-bar'],['native-tabbar','tabbar'],['native-tabs','tabs']]){await open(id,'[data-component-demo="'+kind+'"]');assert(demo().scrollWidth<=win.innerWidth+1,'示例横向溢出 '+kind);await back()}
      frame.style.width='390px';
    });
    await check('旧发现链接进入原生目录，直接打开详情返回原生而非首页',async()=>{
      await load('/discover');assert(catalog(),'旧发现链接失效');await load('/native/app-bar');await back();assert(win.location.hash==='#/native','直达详情的回退目录错误');
      await load('/example/native-navigation');await until(()=>doc.querySelector('.demo-detail:not([inert])'));doc.querySelector('[aria-label="返回原生组件"]').click();await until(()=>catalog());assert(win.location.hash==='#/native','旧共享示例未归属原生目录');
    });
    await check('Android 目录保留当前页面，六个入口调用各自原生页面地址',async()=>{
      const calls=[];Object.defineProperty(win.navigator,'userAgent',{configurable:true,value:'Android Tauri'});win.isTauri=true;
      win.__TAURI_INTERNALS__={invoke:async(command,args)=>{if(command==='plugin:native-components|push')calls.push(args)}};
      const paths=['/example/native-app','/native/app-bar','/native/tabbar','/native/tabs','/page-refresh','/example/native-navigation'];
      const links=[...catalog().querySelectorAll('[data-demo-link]')];
      for(let index=0;index<links.length;index++){links[index].click();await until(()=>calls.length===index+1);assert(calls[index].path.endsWith('#'+paths[index]),'原生跳转地址错误');assert(catalog()&&win.location.hash==='#/native','原生跳转改变了父目录')}
    });
    document.querySelector('#result').textContent=JSON.stringify({passed:reports.length,total:7,reports},null,2);
  }catch(error){document.querySelector('#result').textContent=JSON.stringify({passed:reports.length,error:String(error.stack||error),reports},null,2)}finally{document.querySelector('#run').disabled=false}};
}
</script></html>
