<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page 页面与下拉刷新检查</title><style>body{font:14px system-ui;margin:20px}iframe{width:390px;height:650px;border:1px solid #ddd}pre{white-space:pre-wrap}</style>
<h1>Page 页面与下拉刷新</h1><button id="run">运行检查</button><pre id="result">尚未运行</pre><div id="fixture"></div>
<script type="module">
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms)),params=new URLSearchParams(location.search);
if(params.has('frame')){
  window.calls=[];window.failPage=false;
  if(params.get('frame')==='android'){
    Object.defineProperty(navigator,'userAgent',{value:'Android Tauri',configurable:true});window.isTauri=true;
    window.__TAURI_INTERNALS__={invoke:async(command,args)=>{window.calls.push({command,args});if(window.failPage&&args.surface?.kind==='page')throw Error('page denied')}};
  }
  document.body.innerHTML='<div id="app"></div>';
  await import('/tests/page.fixture.ts').catch(error=>{document.body.textContent=error.stack;throw error});
}else{
  const reports=[],assert=(value,message)=>{if(!value)throw Error(message)},until=async(check,message='等待超时')=>{const start=performance.now();while(!check()){if(performance.now()-start>10000)throw Error(message);await pause(25)}};
  let frame,doc,win;
  const load=async platform=>{document.querySelector('#fixture').replaceChildren();frame=document.createElement('iframe');frame.src='?frame='+platform;document.querySelector('#fixture').append(frame);await until(()=>frame.contentWindow.page);doc=frame.contentDocument;win=frame.contentWindow;await pause(120)};
  const point=selector=>{const rect=doc.querySelector(selector).getBoundingClientRect();return {x:rect.left+rect.width/2,y:rect.top+Math.min(15,rect.height/2)}};
  const touch=(target,type,x,y)=>{const item=new win.Touch({identifier:1,target,clientX:x,clientY:y,pageX:x,pageY:y});const event=new win.TouchEvent(type,{bubbles:true,cancelable:true,touches:/end|cancel/.test(type)?[]:[item],targetTouches:/end|cancel/.test(type)?[]:[item],changedTouches:[item]});target.dispatchEvent(event);return event};
  const pull=async(selector='#pull-start',dx=0,dy=160,end='touchend')=>{const target=doc.querySelector(selector),p=point(selector);touch(target,'touchstart',p.x,p.y);const event=touch(target,'touchmove',p.x+dx,p.y+dy);touch(target,end,p.x+dx,p.y+dy);await pause(40);return event};
  const latest=()=>win.calls.filter(call=>call.args.surface?.kind==='page').at(-1)?.args.surface;
  const probeState=selector=>{const p=point(selector),detail={id:latest().id,x:p.x,y:p.y,allowed:false,atTop:false};win.dispatchEvent(new win.CustomEvent('native-components-refresh-probe',{detail}));return detail};
  const probe=selector=>probeState(selector).allowed;
  const refreshEvent=(request,id=latest().id)=>win.dispatchEvent(new win.CustomEvent('native-components',{detail:{id,action:'refresh',request}}));
  const check=async(name,fn)=>{await fn();reports.push({name,passed:true})};
  document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;reports.length=0;try{
    await load('web');
    await check('Page 固定导航，公开滚动方法仅移动默认插槽内容',async()=>{
      const header=doc.querySelector('.nc-page-navbar'),top=header.getBoundingClientRect().top;
      assert(header.offsetHeight===56&&win.page.scrollElement.clientHeight===504,'页面区域尺寸不正确');
      win.page.scrollTo({top:200,behavior:'instant'});assert(win.page.scrollElement.scrollTop===200&&header.getBoundingClientRect().top===top,'导航随内容滚动');
      win.page.scrollTo({top:0});assert(win.calls.length===0,'Web 调用了原生桥');
    });
    await check('短下拉、取消、横向、输入和内层滚动均不触发刷新',async()=>{
      await pull('#pull-start',0,80);await pull('#pull-start',0,180,'touchcancel');await pull('#pull-start',160,20);await pull('#input');await pull('#nested');await pull('#horizontal');await pull('#excluded');
      assert(win.refreshes===0,'不允许的手势触发了刷新');
      win.page.scrollTo({top:30});await pull();assert(win.refreshes===0,'列表中间触发了刷新');win.page.scrollTo({top:0});
    });
    await check('达到阈值后刷新一次，业务结束和同步完成均能复位',async()=>{
      const event=await pull();assert(event.defaultPrevented&&win.refreshes===1&&win.state.refreshing.value,'刷新没有进入受控状态');
      assert(doc.querySelector('.nc-page-refreshing')&&doc.querySelector('[role="status"]').textContent==='正在刷新','缺少刷新反馈');
      await pull();win.page.refresh();assert(win.refreshes===1,'刷新中重复触发');
      win.state.refreshing.value=false;await pause(40);assert(!doc.querySelector('.nc-page-refresh'),'刷新结束未收起');
      win.immediate=true;win.page.refresh();await pause(40);win.page.refresh();await pause(40);assert(win.refreshes===3&&!win.state.refreshing.value,'同步完成后仍被锁住');win.immediate=false;
    });
    await check('禁用、隐藏、遮罩和 KeepAlive 失活均停止手势并保留滚动',async()=>{
      const count=win.refreshes;
      for(const key of ['disabled','suspended']){win.state[key].value=true;await pause(40);await pull();win.page.refresh();win.state[key].value=false;await pause(40)}
      win.state.active.value=false;await pause(40);await pull();win.state.active.value=true;await pause(40);
      doc.querySelector('#app').inert=true;win.page.refresh();doc.querySelector('#app').inert=false;
      assert(win.refreshes===count,'不可交互页面仍可刷新');
      win.page.scrollTo({top:230});win.state.shown.value=false;await pause(40);win.page.refresh();win.state.shown.value=true;await pause(60);
      assert(win.page.scrollElement.scrollTop===230&&win.refreshes===count,`缓存页位置 ${win.page.scrollElement.scrollTop}，刷新 ${win.refreshes}/${count}`);
    });
    await load('android');
    await check('Android 页面宿主接管导航，暂停内容时保留导航实例',async()=>{
      await until(()=>doc.querySelector('[data-native-refresh="true"]'));
      assert(latest().bounds.height===doc.querySelector('.nc-page-body').clientHeight&&latest().enabled&&!latest().refreshing,'原生页面配置不完整');
      assert(win.getComputedStyle(doc.querySelector('#content')).visibility==='visible','原生刷新隐藏了 Web 内容');
      win.state.suspended.value=true;await until(()=>latest().visible===false);assert(doc.querySelector('[data-native="true"]'),'暂停内容误卸载页面导航');
      win.state.suspended.value=false;await until(()=>latest().visible&&doc.querySelector('[data-native="true"]'));
    });
    await check('关闭下拉时保持普通页面，外部刷新状态只控制指示器',async()=>{
      win.state.refreshable.value=false;await until(()=>latest().visible===false);win.page.refresh();
      assert(win.refreshes===0&&!latest().enabled,'关闭下拉后仍发起刷新');
      win.state.refreshing.value=true;await until(()=>latest().visible&&latest().refreshing);
      assert(win.refreshes===0&&!latest().enabled&&doc.querySelector('[data-native-refresh="true"]'),'外部状态没有显示原生指示器或重复触发业务');
      win.state.refreshing.value=false;await until(()=>latest().visible===false);
      win.state.refreshable.value=true;await until(()=>latest().visible&&latest().enabled);
    });
    await check('原生手势资格与到顶状态分离，起手未到顶也可继续交接',async()=>{
      assert(probe('#pull-start')&&probeState('#pull-start').atTop&&latest().atTop,'顶部普通内容被拒绝或未同步边界');
      for(const selector of ['#input','#nested','#horizontal','#excluded'])assert(!probe(selector),'未排除 '+selector);
      win.page.scrollTo({top:20});const moving=probeState('#pull-start');
      assert(moving.allowed&&!moving.atTop,'未到顶时把整次手势拒绝，或误判为到顶');await until(()=>latest().atTop===false);
      const calls=win.calls.filter(call=>call.args.surface?.kind==='page').length;
      for(const top of [40,60,80])win.page.scrollTo({top,behavior:'instant'});await pause(80);
      assert(win.calls.filter(call=>call.args.surface?.kind==='page').length===calls,'普通滚动逐帧更新了原生桥');
      win.page.scrollTo({top:0});await until(()=>latest().atTop===true);
      win.state.disabled.value=true;await pause(40);assert(!probe('#pull-start'),'禁用时仍允许手势');win.state.disabled.value=false;await pause(40);
    });
    await check('原生刷新请求去重并回传确认，迟到或其他页面事件不触发业务',async()=>{
      refreshEvent(1);refreshEvent(1);refreshEvent(2,'other');await pause(60);
      assert(win.refreshes===1&&win.state.refreshing.value&&latest().refreshToken===1&&latest().refreshing,'请求与状态未对应');
      win.state.refreshing.value=false;await until(()=>!latest().refreshing);
      win.state.disabled.value=true;await pause(40);refreshEvent(2);await pause(40);assert(win.refreshes===1&&latest().refreshToken===2&&!latest().refreshing,'拒绝请求没有确认结束');
      win.state.disabled.value=false;win.state.shown.value=false;await until(()=>latest().visible===false);refreshEvent(3);await pause(40);assert(win.refreshes===1,'缓存页响应了迟到事件');
      win.state.shown.value=true;await until(()=>latest().visible);
    });
    await check('原生桥失败自动使用 Web 下拉，恢复后重新接入原生',async()=>{
      win.failPage=true;win.state.disabled.value=true;await until(()=>win.errors.length>0);win.state.disabled.value=false;await pause(80);
      assert(!doc.querySelector('[data-native-refresh="true"]'),'失败后仍标记原生可用');await pull();assert(win.refreshes===2&&win.state.refreshing.value,'Web 回退不可用');
      win.state.refreshing.value=false;win.failPage=false;win.state.disabled.value=true;await pause(50);win.state.disabled.value=false;await until(()=>doc.querySelector('[data-native-refresh="true"]'));
    });
    await check('卸载释放原生页面与探测监听，迟到刷新事件被忽略',async()=>{
      const id=latest().id,count=win.refreshes;win.app.unmount();await pause(50);
      assert(win.calls.some(call=>call.args.surface?.id===id&&call.args.surface.remove),'未释放原生页面');
      const detail={id,x:30,y:80,allowed:false};win.dispatchEvent(new win.CustomEvent('native-components-refresh-probe',{detail}));refreshEvent(99,id);
      assert(!detail.allowed&&win.refreshes===count,'卸载后仍响应事件');
    });
    document.querySelector('#result').textContent=JSON.stringify({passed:reports.length,failed:0,reports},null,2);
  }catch(error){document.querySelector('#result').textContent=JSON.stringify({passed:reports.length,failed:1,error:error.message,reports},null,2)}finally{document.querySelector('#run').disabled=false}};
}
</script></html>
