<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>App 文档与完整示例回归</title>
<style>body{font:14px system-ui;margin:20px}iframe{width:1100px;height:900px;border:1px solid #ddd}pre{white-space:pre-wrap}</style>
<h1>App 文档与完整示例</h1><button id="run">运行检查</button><pre id="result">尚未运行</pre><div id="fixture"></div>
<script type="module">
const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
const mode = new URLSearchParams(location.search).get('frame');
if (mode) {
  if (mode === 'android') {
    Object.defineProperty(navigator, 'userAgent', { value: 'Android Tauri', configurable: true });
    window.isTauri = true; window.calls = [];
    window.__TAURI_INTERNALS__ = { invoke: async (command, args) => { window.calls.push({ command, args }) } };
  }
  document.body.innerHTML = '<div id="app"></div>';
  const base = document.createElement('base'); base.href = '/example/'; document.head.append(base);
  await import('/example/src/main.ts');
} else {
  const reports = [], assert = (value, message) => { if (!value) throw Error(message) };
  const until = async (check, message = '等待 App 文档超时') => {
    const start = performance.now();
    while (!check()) { if (performance.now() - start > 12000) throw Error(message); await pause(20) }
  };
  let frame, doc, win;
  const root = () => doc.querySelector('.demo-detail:not([inert])');
  const load = async (mode = 'web') => {
    frame = document.createElement('iframe'); frame.src = '?frame=' + mode + '#/example/native-app';
    document.querySelector('#fixture').replaceChildren(frame);
    await until(() => frame.contentDocument?.querySelector('[data-example="app-container"]'));
    doc = frame.contentDocument; win = frame.contentWindow;
  };
  const check = async (name, run) => { document.querySelector('#result').textContent = '运行中：' + name; await run(); reports.push({ name, passed: true }) };
  const button = (node, text) => [...node.querySelectorAll('button')].find(item => item.textContent.includes(text));
  document.querySelector('#run').onclick = async () => {
    document.querySelector('#run').disabled = true;
    try {
      await load();
      await check('两个示例分别对应实际 App 与独立页源码，配置依赖完整可读', async () => {
        const { previewGroups } = await import('/example/src/demo/code/source.ts');
        const groups = await previewGroups('native-app');
        assert(groups.map(group => group.name).join() === 'app-container,app-pages', '示例和代码分组错误');
        assert(!root().querySelector('.app-api').textContent.includes('#navbar'), 'App 文档仍提供 navbar 插槽');
        for (const group of groups) {
          const block = root().querySelector('[data-example="' + group.name + '"]');
          assert(block.querySelector('.doc-example-preview') && block.querySelector('.demo-code-files'), '预览没有配套代码');
          for (const file of group.files) {
            const source = await file.source();
            assert(source.length > 50 && !source.includes('<iframe') && !source.includes('<DemoExample'), '展示了文档外壳而非实际源码');
            assert(!source.includes('#navbar'), 'App 示例仍使用 navbar 插槽');
            assert(!/<style\b|\bstyle=|style\.css/.test(source), 'App 用法代码混入了 CSS');
            assert(!/\bdraft\b|\bcount\b|<Card\b|<Input\b/.test(source), 'App 用法代码混入了业务演示');
          }
          block.querySelector('summary').click();
          await until(() => block.querySelector('code'));
          assert(block.querySelector('code').textContent.includes(group.name === 'app-container' ? '<App ' : 'useApp'), '示例第一份源码不对应预览');
          block.querySelector('summary').click();
        }
        assert(root().querySelectorAll('.doc-outline a').length === 2, '文档目录没有分别定位两个示例');
      });
      await check('最小预览支持 Tab 切换与独立页往返，保留容器和页面实例', async () => {
        const preview = root().querySelector('iframe');
        await until(() => preview.contentDocument?.querySelector('.nc-app'));
        const pd = preview.contentDocument, app = pd.querySelector('.nc-app'), bar = pd.querySelector('.nc-app-tabbar'), home = pd.querySelector('[data-app-tab="home"]');
        pd.querySelector('[aria-label="我的"]').click(); await pause(60);
        const profile = pd.querySelector('[data-app-tab="profile"]');
        assert(profile.querySelector('h2').textContent === '我的', '底栏没有切换到对应页面');
        pd.querySelector('[aria-label="首页"]').click(); await pause(60);
        assert(pd.querySelector('[data-app-tab="home"]') === home, 'Tab 切换重建了页面');
        pd.querySelector('[aria-label="我的"]').click(); await pause(60);
        button(profile, '打开独立页面').click(); await until(() => pd.querySelector('.nc-app-route-view'));
        assert(bar.hidden && pd.querySelector('.nc-app-route-view h2').textContent === '独立页面', '独立页没有打开或底栏没有隐藏');
        button(pd.querySelector('.nc-app-route-view'), '返回').click(); await until(() => !pd.querySelector('.nc-app-route-view'));
        assert(pd.querySelector('.nc-app') === app && pd.querySelector('.nc-app-tabbar') === bar && !bar.hidden, '返回重建了容器或底栏');
        assert(pd.querySelector('.nc-app-view-active') === profile, '返回没有保留当前 Tab');
      });
      await check('320、390 与桌面宽度下文档和 App 均不溢出，独立代码页展示两组代码', async () => {
        for (const width of [320, 390, 1463]) {
          frame.style.width = width + 'px'; await pause(70);
          const page = root(), preview = page.querySelector('iframe'), app = preview.contentDocument.querySelector('.nc-app');
          assert(page.scrollWidth <= page.clientWidth + 1, '文档横向溢出 ' + width);
          assert(app.scrollWidth <= app.clientWidth + 1 && app.querySelector('.nc-app-view-active').scrollWidth <= app.clientWidth + 1, 'App 横向溢出 ' + width);
          assert((win.getComputedStyle(page.querySelector('.doc-outline')).display === 'none') === (width <= 1024), '目录响应式错误');
        }
        win.location.hash = '/code/native-app';
        await until(() => doc.querySelectorAll('.code-page [data-code-example]').length === 2);
        await until(() => doc.querySelectorAll('.code-page code').length >= 2);
        assert(doc.querySelector('.code-page').textContent.includes('App 容器与底部 TabBar') && doc.querySelector('.code-page').textContent.includes('独立页面与返回'), '独立代码页缺少分组');
      });
      await check('Android 文档通过完整原生页面打开示例，不在 iframe 中创建原生宿主', async () => {
        await load('android');
        assert(!root().querySelector('iframe') && root().querySelector('.app-native-preview'), 'Android 文档仍在内嵌框架中创建 App');
        button(root(), '打开 App 示例').click();
        await until(() => win.calls.some(call => call.command === 'plugin:native-components|push'));
        assert(win.calls.find(call => call.command === 'plugin:native-components|push').args.path.endsWith('#/native/app-demo'), '完整 App 示例目标错误');
        assert(win.location.hash === '#/example/native-app', '打开原生页面改变了文档路由');
        button(root(), '打开独立页面').click();
        await until(() => win.calls.filter(call => call.command === 'plugin:native-components|push').length === 2);
        assert(win.calls.filter(call => call.command === 'plugin:native-components|push').at(-1).args.path.endsWith('#/native/app-demo/detail'), '独立页面示例目标错误');
      });
      document.querySelector('#result').textContent = JSON.stringify({ passed: reports.length, total: 4, reports }, null, 2);
    } catch (error) {
      document.querySelector('#result').textContent = JSON.stringify({ passed: reports.length, error: String(error.stack || error), reports }, null, 2);
    } finally { document.querySelector('#run').disabled = false }
  };
}
</script></html>
