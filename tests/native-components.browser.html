<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>原生导航 Vue 组件检查</title><style>body{font:14px system-ui;margin:20px}iframe{width:390px;height:700px;border:1px solid #ddd}pre{white-space:pre-wrap}</style>
<h1>原生导航组件</h1><button id="run">运行检查</button><pre id="result">尚未运行</pre><div id="fixture"></div>
<script type="module">
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms)), params=new URLSearchParams(location.search);
if(params.has('frame')){
  const android=params.get('frame')==='android';
  window.calls=[];window.events=[];window.fail=false;
  if(android){
    Object.defineProperty(navigator,'userAgent',{value:'Android Tauri',configurable:true});window.isTauri=true;
    window.__TAURI_INTERNALS__={invoke:async(command,args)=>{window.calls.push({command,args});if(window.fail)throw Error('denied')}};
  }
  document.body.innerHTML='<div id="app"></div>';
  await import('/tests/native-components.fixture.ts').catch(error=>{document.body.textContent=error.stack;throw error});
}else{
  const reports=[],assert=(value,message)=>{if(!value)throw Error(message)},until=async check=>{let start=performance.now();while(!check()){if(performance.now()-start>10000)throw Error('等待超时');await pause(30)}};
  let frame,doc,win;
  const load=async platform=>{document.querySelector('#fixture').replaceChildren();frame=document.createElement('iframe');frame.src='?frame='+platform;document.querySelector('#fixture').append(frame);await until(()=>frame.contentWindow.state);doc=frame.contentDocument;win=frame.contentWindow;await pause(180)};
  const check=async(name,fn)=>{await fn();reports.push({name,passed:true})};
  document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;reports.length=0;try{
    await load('web');
    await check('Web 尺寸、返回操作、操作项和 Tab 事件',async()=>{
      assert(doc.querySelector('.nc-app-bar').offsetHeight===56&&doc.querySelector('.nc-bottom-navigation').offsetHeight===64,'导航尺寸不一致');
      doc.querySelector('[aria-label="返回"]').click();doc.querySelector('[aria-label="设置"]').click();
      doc.querySelector('[aria-label="发现"]').click();await pause(30);
      assert(win.state.selected.value==='discover'&&win.events.join(',')==='back,settings,discover','事件未正常传递');
      doc.querySelector('[aria-label="消息"]').click();assert(win.state.selected.value==='discover','禁用项被选中');assert(win.calls.length===0,'Web 调用了原生接口');
    });
    await check('导航图形与文字共用中轴，间距不包含选中背景的留白',async()=>{
      for(const button of doc.querySelectorAll('.nc-bottom-navigation button')){
        const svg=button.querySelector('svg'),icon=svg.getBoundingClientRect(),label=button.lastElementChild.getBoundingClientRect();
        const box=svg.getBBox();assert(Math.abs(box.x+box.width/2-12)<.01,'图标路径在 24 像素画布上偏离中心');
        assert(Math.abs(icon.x+icon.width/2-label.x-label.width/2)<.01,'图标与文字没有共用中轴');
        assert(Math.abs(label.top-icon.bottom-2)<.01,'选中背景的留白仍被算进图标与文字间距');
      }
    });
    await load('android');
    await check('Android 创建两种控件，传递真实尺寸、图标和颜色，成功后隐藏 Web 对应内容',async()=>{
      await until(()=>doc.querySelectorAll('[data-native="true"]').length===2);
      const header=win.calls.find(call=>call.args.surface.kind==='appBar').args.surface;
      assert(header.title==='组件示例'&&Math.abs(header.bounds.height-56)<.01&&header.actions[0].paths.length>0,'导航头配置不完整 '+JSON.stringify(header));
      assert(header.style.surface===-1&&header.style.primary!==0,'颜色未解析');
      assert(win.calls.some(call=>call.args.surface.kind==='bottomNavigation'),'没有底部原生控件');
    });
    await check('事件按组件 id 分发，原生 Tab 更新 Vue 状态',async()=>{
      const header=win.calls.find(call=>call.args.surface.kind==='appBar').args.surface,tab=win.calls.find(call=>call.args.surface.kind==='bottomNavigation').args.surface;
      win.dispatchEvent(new win.CustomEvent('native-components',{detail:{id:header.id,action:'back'}}));
      win.dispatchEvent(new win.CustomEvent('native-components',{detail:{id:tab.id,action:'select',value:'profile'}}));await pause(100);
      assert(win.events.join(',')==='back,profile'&&win.state.selected.value==='profile','原生事件没有进入组件');
    });
    await check('Web 弹层显示时移除原生栏并恢复 Web 对应内容，退出后恢复',async()=>{
      win.state.suspended.value=true;await until(()=>!doc.querySelector('[data-native="true"]'));
      assert(win.calls.filter(call=>call.args.surface.visible===false).length>=2,'原生栏未移除');
      win.state.suspended.value=false;await until(()=>doc.querySelectorAll('[data-native="true"]').length===3);
    });
    await check('Tab 绑定独立原生页面，原生页面操作返回所属 Vue 容器',async()=>{
      const tabs=win.calls.filter(call=>call.args.surface.kind==='tabs'&&call.args.surface.visible).at(-1).args.surface;
      assert(tabs.modelValue==='profile'&&tabs.items.find(item=>item.value==='profile').nativeView==='demo','原生内容没有绑定当前 Tab');
      assert(doc.querySelector('.nc-tabs-web').inert,'底层 Web 内容仍可交互');
      win.dispatchEvent(new win.CustomEvent('native-components',{detail:{id:tabs.id,action:'tabAction',tab:'profile',value:'increment'}}));await pause(30);
      assert(win.events.includes('profile:increment'),'原生页面操作没有通知 Vue');
    });
    await check('页面计数更新只交给内容容器，不触碰底栏配置',async()=>{
      const calls=win.calls.filter(call=>call.args.surface.kind==='bottomNavigation').length;
      const item=win.state.items.value.find(item=>item.value==='profile');item.nativeProps.count=19;await pause(180);
      assert(win.calls.filter(call=>call.args.surface.kind==='bottomNavigation').length===calls,'页面业务更新仍触发底栏桥接');
      const tabs=win.calls.filter(call=>call.args.surface.kind==='tabs').at(-1).args.surface;
      assert(tabs.items.find(item=>item.value==='profile').nativeProps.count===19,'页面业务数据没有正常更新');
      assert(win.calls.filter(call=>call.args.surface.kind==='bottomNavigation').every(call=>call.args.surface.items.every(item=>!('nativeProps'in item)&&!('nativeView'in item))),'底栏仍携带页面工厂或业务数据');
    });
    await check('权限失败保留 Web 版本，卸载组件只移除自己的原生栏',async()=>{
      win.fail=true;win.state.title.value='更新标题';await until(()=>win.events.includes('error'));
      assert(!doc.querySelector('.nc-app-bar').dataset.native,'失败后 Web 版本仍被隐藏');
      const id=win.calls.find(call=>call.args.surface.kind==='appBar').args.surface.id;win.fail=false;win.state.visible.value=false;await pause(100);
      assert(win.calls.some(call=>call.args.surface.id===id&&call.args.surface.visible===false),'卸载没有清理原生栏');assert(doc.querySelector('.nc-bottom-navigation'),'误卸载底部导航');
    });
    document.querySelector('#result').textContent=JSON.stringify({passed:reports.length,failed:0,reports},null,2);
  }catch(error){document.querySelector('#result').textContent=JSON.stringify({passed:reports.length,failed:1,error:error.message,reports},null,2)}finally{document.querySelector('#run').disabled=false}};
}
</script></html>
