<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>my-ui 首页列表与示例导航检查</title
  ><style>
    body {
      font: 14px system-ui;
      margin: 20px;
      background: #f2f3f5;
      color: #17191e;
    }
    iframe {
      display: block;
      width: 390px;
      height: 844px;
      max-width: none;
      border: 1px solid #ddd;
      background: white;
      margin-top: 20px;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
  <main>
    <h1>首页列表与示例导航</h1>
    <button id="run">运行定向检查</button>
    <pre id="result">尚未运行</pre>
    <div id="fixture"></div>
  </main>
  <script type="module">
    const params = new URLSearchParams(location.search)
    if (params.has('frame')) {
      document.body.innerHTML = '<div id="app"></div>'
      const base = document.createElement('base')
      base.href = '/examples/tauri/ui/'
      document.head.append(base)
      // 使用正式入口验证目录、真实组件、持久状态与弹层返回。
      await import('/examples/tauri/ui/src/main.ts').catch((error) => {
        document.body.textContent = error.stack
        throw error
      })
    } else {
      const reports = [],
        fixture = document.querySelector('#fixture'),
        pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
      const assert = (value, message) => {
        if (!value) throw Error(message)
      }
      const until = async (check, message) => {
        const start = performance.now()
        while (!check()) {
          if (performance.now() - start > 10000) throw Error(message)
          await pause(30)
        }
      }
      let frame, doc, win
      const tab = (index) => doc.querySelectorAll('[data-demo-tabbar] button')[index]
      const page = () => doc.querySelector('.demo-page:not([inert])')
      const pick = async (index) => {
        tab(index).click()
        await pause(90)
      }
      const route = async (hash) => {
        win.location.hash = hash
        await pause(160)
      }
      const open = async (id) => {
        let link = doc.querySelector('[data-demo-link="' + id + '"]')
        // 应用目录按首次访问创建，直达文档返回后尚未挂载该栏目。
        if (!link) {
          await pick(1)
          link = doc.querySelector('[data-demo-link="' + id + '"]')
        }
        assert(link, '目录缺少入口 ' + id)
        const catalog = link.closest('[data-demo-page]').dataset.demoPage
        if (page()?.dataset.demoPage !== catalog) await pick(catalog === 'native' ? 1 : 0)
        link.click()
        await until(() => page()?.dataset.demoPage === 'example/' + id, '无法进入 ' + id)
        await pause(70)
      }
      const back = async () => {
        const catalog = page().dataset.demoPage === 'example/native-navigation' ? 'native' : 'home'
        doc.querySelector('.demo-view:not([inert]) .demo-top [aria-label^="返回"]').click()
        await until(() => page()?.dataset.demoPage === catalog, '无法返回列表')
        await pause(70)
      }
      const check = async (name, run) => {
        document.querySelector('#result').textContent = '运行中：' + name
        await run()
        reports.push({ name, passed: true })
      }
      document.querySelector('#run').onclick = async () => {
        document.querySelector('#run').disabled = true
        document.querySelector('#result').textContent = '运行中'
        reports.length = 0
        fixture.replaceChildren()
        try {
          frame = document.createElement('iframe')
          frame.src = '/tests/demo-layout.browser.html?frame=1#actions'
          frame.title = '移动 App 示例'
          fixture.append(frame)
          await until(
            () =>
              frame.contentDocument?.querySelectorAll('[data-demo-tabbar] button').length === 4,
            '示例加载失败'
          )
          doc = frame.contentDocument
          win = frame.contentWindow
          await pause(180)
          const links = [...doc.querySelectorAll('[data-demo-page="home"] [data-demo-link]')].map(
            (node) => node.dataset.demoLink
          )
          const ids = links.filter(
            (id) => !['quick-start', 'native-integration', 'showcase'].includes(id)
          )
          await check(
            '首页与应用分别展示目录，消息保留 Demo，设置管理自己的大标题与搜索',
            async () => {
              assert(page().dataset.demoPage === 'home', '首页未展示目录')
              assert(
                links.length === 31 && new Set(links).size === links.length && ids.length === 28,
                '目录不完整或重复'
              )
              assert(doc.querySelectorAll('.demo-detail').length === 0, '首屏提前挂载全部示例')
              assert(
                [...doc.querySelectorAll('[data-demo-tabbar] button')]
                  .map((node) => node.textContent.trim())
                  .join(',') === '首页,应用,消息,设置',
                '底部导航不正确'
              )
              await pick(1)
              assert(
                page().dataset.demoPage === 'native' &&
                  page().querySelectorAll('[data-demo-link]').length === 6 &&
                  !page().querySelector('.demo-placeholder'),
                '应用目录不完整'
              )
              await pick(2)
              assert(page().querySelector('.demo-placeholder') && page().textContent.includes('Demo 页面'), '消息占位页被修改')
              await pick(3)
              assert(page().querySelector('[data-settings-home]') && page().textContent.includes('显示与亮度'), '设置布局未接入')
              assert(!page().closest('.demo-view').querySelector('.demo-top'), '设置仍使用统一导航头')
              assert(page().querySelector('.settings-search') && page().querySelectorAll('.settings-group').length === 5, '搜索栏或设置分组不完整')
              assert(win.location.hash === '#/settings', '设置路由没有更名')
              await pick(0)
            }
          )
          await check('整行点击进入独立示例，详情隐藏底栏，顶栏显示返回按钮', async () => {
            const position = win.history.state.position
            await open('button')
            assert(
              win.location.hash === '#/example/button' &&
                win.history.state.position === position + 1,
              '未建立详情返回历史'
            )
            assert(
              doc.querySelector('.demo-view:not([inert]) .demo-top [data-demo-title]').textContent === 'Button 按钮' &&
                page().textContent.includes('主要按钮'),
              '示例或标题错误'
            )
            assert(
              win.getComputedStyle(doc.querySelector('[data-demo-tabbar]')).display === 'none',
              '详情仍可操作底栏'
            )
            assert(
              doc.activeElement === doc.querySelector('.demo-view:not([inert]) .demo-top [data-demo-title]'),
              '进入详情未转移焦点'
            )
            assert(doc.querySelector('[data-demo-page="home"]').inert, '列表仍可交互')
            await back()
          })
          await check('返回恢复目录滚动与入口焦点，Tab 切换不增加返回层级', async () => {
            const home = page()
            home.scrollTop = 630
            await pause(50)
            await open('input')
            await back()
            assert(Math.abs(page().scrollTop - 630) < 2, '返回丢失目录位置')
            assert(
              doc.activeElement === doc.querySelector('[data-demo-link="input"]'),
              '返回焦点没有落回入口'
            )
            const length = win.history.length
            await pick(1)
            await pick(2)
            await pick(3)
            await pick(0)
            assert(Math.abs(page().scrollTop - 630) < 2, 'Tab 切换丢失目录位置')
            assert(win.history.length === length, '同级切换增加历史')
            await pick(0)
            assert(Math.abs(page().scrollTop - 630) < 2, '重复点击首页重置了滚动位置')
          })
          await check('首页目录入口全部有独立内容，返回不会跳到其他示例', async () => {
            for (const id of ids) {
              await open(id)
              assert(page().querySelector('.demo-page-inner').children.length > 0, '空示例 ' + id)
              assert(page().querySelector('[data-my-component],.my-card'), '缺失真实组件 ' + id)
              assert(
                doc.querySelectorAll('.demo-page:not([inert])').length === 1,
                '多个页面可交互 ' + id
              )
              await back()
            }
          })
          await check('打开过的示例保留输入与实例，隐藏内容离开焦点与辅助树', async () => {
            await open('input')
            const input = page().querySelector('input')
            input.value = '保留本次输入'
            input.dispatchEvent(new win.Event('input', { bubbles: true }))
            await pause(40)
            await back()
            await open('combobox')
            await back()
            await open('input')
            assert(
              page().querySelector('input') === input && input.value === '保留本次输入',
              '返回重建或清空输入'
            )
            for (const hidden of doc.querySelectorAll('.demo-page[inert]'))
              assert(
                hidden.getAttribute('aria-hidden') === 'true' &&
                  hidden.getBoundingClientRect().height === 0,
                '隐藏页面仍可参与交互'
              )
            await back()
          })
          await check('返回目录暂停播放和模拟上传，重新进入保留进度与实例', async () => {
            await open('primitives')
            const detail = page(),
              clock = detail.querySelector('.playback-time'),
              progress = detail.querySelector('.transfer-demo [role="progressbar"]')
            const play = () => detail.querySelector('.playback-actions button'),
              upload = () => detail.querySelector('.transfer-actions button')
            play().click()
            upload().click()
            await pause(550)
            await back()
            const time = clock.textContent,
              value = progress.getAttribute('aria-valuenow')
            await pause(700)
            assert(
              clock.textContent === time && progress.getAttribute('aria-valuenow') === value,
              '隐藏示例仍在推进播放或上传'
            )
            await open('primitives')
            assert(
              page() === detail && page().querySelector('.playback-time') === clock,
              '暂停时重建了示例'
            )
            assert(
              play().textContent.trim() === '播放' && !upload().textContent.includes('暂停'),
              '返回后没有保持暂停'
            )
            play().click()
            await pause(550)
            assert(clock.textContent !== time, '重新播放无法继续')
            await back()
          })
          await check('文档隐藏与 KeepAlive 停用也会暂停，返回不会自动启动任务', async () => {
            await open('primitives')
            const detail = page(),
              clock = detail.querySelector('.playback-time'),
              play = detail.querySelector('.playback-actions button')
            const descriptor = Object.getOwnPropertyDescriptor(doc, 'hidden')
            try {
              play.click()
              Object.defineProperty(doc, 'hidden', { configurable: true, value: true })
              doc.dispatchEvent(new win.Event('visibilitychange'))
              await pause(60)
              const time = clock.textContent
              await pause(650)
              assert(
                clock.textContent === time && play.textContent.trim() === '播放',
                '文档隐藏后仍在播放'
              )
            } finally {
              if (descriptor) Object.defineProperty(doc, 'hidden', descriptor)
              else Reflect.deleteProperty(doc, 'hidden')
              doc.dispatchEvent(new win.Event('visibilitychange'))
            }
            await pause(60)
            play.click()
            win.location.hash = '/shared-state'
            await until(() => doc.querySelector('.native-page'), '未进入共享页')
            await pause(60)
            const time = clock.textContent
            await pause(650)
            assert(
              clock.textContent === time && play.textContent.trim() === '播放',
              'KeepAlive 停用后仍在播放'
            )
            win.history.back()
            await until(() => page()?.dataset.demoPage === 'example/primitives', '返回缓存示例失败')
            await pause(80)
            assert(page() === detail && clock.textContent === time, '返回重建页面或自动启动播放')
            await back()
          })
          await check('浏览器返回与前进同步详情，旧组件链接仍能定位', async () => {
            await open('image')
            win.history.back()
            await until(() => page().dataset.demoPage === 'home', '浏览器返回没有回目录')
            win.history.forward()
            await until(() => page().dataset.demoPage === 'example/image', '浏览器前进没有恢复详情')
            await back()
            for (const [hash, id] of [
              ['combobox', 'combobox'],
              ['calendar', 'date-time-picker'],
              ['slider-options', 'primitives'],
              ['native-navigation', 'native-navigation'],
              ['scenarios', 'scenarios']
            ]) {
              await route(hash)
              assert(page().dataset.demoPage === 'example/' + id, '旧链接选错页面 ' + hash)
              const target = doc.getElementById(hash).getBoundingClientRect(),
                panel = page().getBoundingClientRect()
              assert(
                target.top >= panel.top - 1 && target.top < panel.bottom,
                '旧链接没有定位 ' + hash
              )
            }
            // 冷启动时文档尚未加载，仍需等待内容挂载后定位旧锚点。
            frame.src = '/tests/demo-layout.browser.html?frame=1#/slider-options'
            await until(
              () => frame.contentDocument?.querySelector('.demo-detail:not([inert]) #slider-options'),
              '直达旧链接没有加载文档'
            )
            doc = frame.contentDocument
            win = frame.contentWindow
            await until(() => {
              const target = doc.getElementById('slider-options').getBoundingClientRect(),
                panel = page().getBoundingClientRect()
              return target.top >= panel.top - 1 && target.top < panel.bottom
            }, '首次加载没有定位旧锚点')
            await route('home')
          })
          await check('详情内弹窗优先关闭，页面与返回入口仍正常', async () => {
            await open('feedback')
            const trigger = [...page().querySelectorAll('button')].find(
              (button) => button.textContent.trim() === '打开确认弹窗'
            )
            assert(trigger, '反馈示例缺少确认弹窗入口')
            trigger.click()
            await until(() => doc.querySelector('.my-overlay.my-show'), '确认弹窗未打开')
            assert(doc.querySelector('#app').inert, '弹窗未隔离页面')
            assert(win.MyUI.layers.dismissTop(), '弹层返回未消费')
            await pause(450)
            assert(
              page().dataset.demoPage === 'example/feedback' && !doc.querySelector('#app').inert,
              '关闭弹层误退页面'
            )
            assert(!win.MyUI.layers.dismissTop(), '弹层退出后仍占返回')
            await back()
          })
          await check('顶栏固定，320px 与桌面均无横向溢出，四个 Tab 有完整触控范围', async () => {
            for (const width of [320, 1100, 390]) {
              frame.style.width = width + 'px'
              await pause(100)
              await pick(0)
              const header = doc.querySelector('.demo-view:not([inert]) .demo-top').getBoundingClientRect(),
                footer = doc.querySelector('[data-demo-tabbar]').getBoundingClientRect(),
                content = page().getBoundingClientRect()
              assert(
                header.top === 0 &&
                  Math.abs(footer.bottom - win.innerHeight) < 2 &&
                  content.bottom <= footer.top + 1,
                '固定导航或正文区域错误'
              )
              assert(
                page().scrollWidth <= page().clientWidth + 2 && win.scrollY === 0,
                '目录横向溢出'
              )
              for (let index = 0; index < 4; index++) {
                await pick(index)
                const rect = tab(index).getBoundingClientRect()
                assert(
                  rect.width >= 44 && rect.height >= 44 && rect.right <= win.innerWidth + 1,
                  'Tab 触控区域不完整'
                )
              }
              await pick(0)
              for (const id of ['button', 'input', 'combobox', 'picker', 'menu']) {
                await open(id)
                assert(
                  page().scrollWidth <= page().clientWidth + 2,
                  '详情横向溢出 ' + width + '/' + id
                )
                const detail = page().getBoundingClientRect()
                assert(
                  detail.top >= header.bottom - 1 && Math.abs(detail.bottom - win.innerHeight) < 2,
                  '详情没有用满剩余高度'
                )
                await back()
              }
            }
          })
          await check('键盘切换 Tab，未知与非法链接安全回到目录', async () => {
            await pick(0)
            tab(0).focus()
            tab(0).dispatchEvent(
              new win.KeyboardEvent('keydown', {
                key: 'ArrowRight',
                bubbles: true,
                cancelable: true
              })
            )
            await pause(90)
            assert(
              page().dataset.demoPage === 'native' && doc.activeElement === tab(1),
              '方向键切换或焦点失效'
            )
            await route('not-a-demo')
            assert(page().dataset.demoPage === 'home', '未知链接没有回目录')
            await route('%E0%A4%A')
            assert(page().dataset.demoPage === 'home', '非法编码没有回目录')
            await route('home')
          })
          await check('直接访问详情时，顶栏返回也能回到列表', async () => {
            frame.src = '/tests/demo-layout.browser.html?frame=1&direct=1#/example/image'
            await until(
              () =>
                frame.contentDocument !== doc &&
                frame.contentDocument?.querySelector('.demo-detail:not([inert])'),
              '直接访问详情失败'
            )
            doc = frame.contentDocument
            win = frame.contentWindow
            await back()
            assert(win.location.hash === '#/home', '直接进入的详情无法回首页')
          })
          await check(
            '共享状态通过 Vue Router 在当前窗口打开，返回保留父页实例和滚动',
            async () => {
              await open('native-navigation')
              const parent = page(),
                input = parent.querySelector('input')
              parent.scrollTop = 80
              const top = parent.scrollTop
              ;[...parent.querySelectorAll('button')]
                .find((node) => node.textContent.includes('打开另一页'))
                .click()
              await until(() => doc.querySelector('.native-page'), '没有进入共享页')
              assert(
                win.location.hash === '#/shared-state' &&
                  doc.querySelector('.native-page.demo-view .demo-scroll'),
                '共享页未通过路由打开或页面布局错误'
              )
              const note = doc.querySelector('.native-page input')
              note.value = '路由返回保留共享内容'
              note.dispatchEvent(new win.Event('input', { bubbles: true }))
              await pause(60)
              doc.querySelector('.native-page .my-app-bar button').click()
              await until(
                () => page()?.dataset.demoPage === 'example/native-navigation',
                '共享页返回失败'
              )
              await pause(80)
              assert(
                page() === parent &&
                  page().querySelector('input') === input &&
                  input.value === '路由返回保留共享内容',
                '父页实例丢失或数据未同步'
              )
              assert(
                page().scrollTop === top,
                '返回丢失滚动位置：' + top + ' → ' + page().scrollTop
              )
              await back()
            }
          )
          await check('原生 HTML 示例在当前窗口承载且可以返回目录示例', async () => {
            await open('native-html')
            page().querySelector('.native-example-link').click()
            await until(() => doc.querySelector('.html-page iframe'), 'HTML 页面未打开')
            const html = doc.querySelector('.html-page iframe')
            await until(
              () => html.contentDocument?.querySelector('.my-button'),
              '纯 HTML 组件没有加载'
            )
            assert(win.location.hash === '#/html', 'HTML 示例没有使用 Vue Router')
            doc.querySelector('.html-page .my-app-bar button').click()
            await until(
              () => page()?.dataset.demoPage === 'example/native-html',
              'HTML 示例返回失败'
            )
            await back()
          })
          document.querySelector('#result').textContent = JSON.stringify(
            { passed: reports.length, total: 14, reports },
            null,
            2
          )
        } catch (error) {
          document.querySelector('#result').textContent = JSON.stringify(
            { passed: reports.length, error: String(error.stack || error), reports },
            null,
            2
          )
        } finally {
          document.querySelector('#run').disabled = false
          window.__demoLayoutReports = reports
        }
      }
    }
  </script>
</html>
