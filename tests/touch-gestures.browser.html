<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>触摸滑动定向检查</title>
<style>main{max-width:900px;padding:24px;margin:auto}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.test-page{min-height:260px;padding:20px;background:var(--fill);border-radius:16px}.test-page h2{font-size:20px}.scroll-test{overflow:auto;width:180px;height:58px;margin-top:16px}.scroll-test>div{width:580px;height:50px}.panel-row{padding:18px 0;border-bottom:1px solid var(--border)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}</style>
<div id="app"></div><script type="module">
import{createApp,h,nextTick,ref}from'vue'
import { Button, Drawer, Sheet, Tabs, Popup, popup } from '/packages/vue/index.ts'
import { applyTheme } from '/example/src/theme/index.js'
applyTheme({backdropBlur:false})
const frame=()=>new Promise(resolve=>requestAnimationFrame(resolve))
// 后台标签页的帧回调可能节流，等待预算与组件的实际动画时长分开。
async function until(check,message,timeout=5000){const start=performance.now();while(!check()){if(performance.now()-start>timeout)throw Error(typeof message==='function'?message():message);await frame()}}
function assert(value,message){if(!value)throw Error(message)}
let identifier=0
function contact(target,x,y,id){return new Touch({identifier:id,target,clientX:x,clientY:y,pageX:x+scrollX,pageY:y+scrollY})}
function send(target,type,touches,changed=touches){return target.dispatchEvent(new TouchEvent(type,{bubbles:true,cancelable:true,touches,targetTouches:touches,changedTouches:changed}))}
async function begin(target){const r=target.getBoundingClientRect(),x=r.left+Math.min(50,r.width/2),y=r.top+Math.min(28,r.height/2),id=++identifier;const touch=contact(target,x,y,id);send(target,'touchstart',[touch]);return{target,x,y,id,touch}}
async function move(state,x,y){state.touch=contact(state.target,state.x+x,state.y+y,state.id);send(state.target,'touchmove',[state.touch]);await frame();await nextTick()}
async function end(state,cancel=false){send(state.target,cancel?'touchcancel':'touchend',[],[state.touch]);await nextTick()}
async function drag(target,x,y,steps=5){const state=await begin(target);for(let i=1;i<=steps;i++)await move(state,x*i/steps,y*i/steps);await end(state);return state}
const shown=selector=>{const e=document.querySelector(selector);return!!e&&e.getClientRects().length>0}
createApp({setup(){
const tab=ref('a'),swipeable=ref(true),mounted=ref(true),drawer=ref(false),sheet=ref(false),placement=ref('right'),result=ref('尚未运行'),running=ref(false),clicks=ref(0),closes=ref(0)
const options=[{value:'a',label:'概览'},{value:'b',label:'文件'},{value:'skip',label:'未开放',disabled:true},{value:'c',label:'动态'}]
const panelBody=()=>h('div',[h('input',{id:'panel-input','aria-label':'面板输入',value:'正常编辑'}),h('button',{id:'panel-action',onClick:()=>clicks.value++},'正文操作'),...Array.from({length:18},(_,i)=>h('div',{class:'panel-row'},'内容记录 '+(i+1)))])
async function open(kind,side='right'){placement.value=side;if(kind==='drawer')drawer.value=true;else sheet.value=true;await nextTick();await until(()=>shown('#touch-'+kind)&&!document.querySelector('.my-'+kind+'-motion-enter-active'),'窗口未完成进入');return document.querySelector('#touch-'+kind)}
async function closeAll(){drawer.value=sheet.value=false;await until(()=>!shown('#touch-drawer')&&!shown('#touch-sheet'),'窗口未关闭');await frame()}
async function resetTabs(){tab.value='a';swipeable.value=true;mounted.value=true;await nextTick();await frame();await frame()}
const view=()=>document.querySelector("#touch-tabs .my-tab-viewport")
async function settled(){await until(()=>!view()?.hasAttribute('data-swiping'),'页签未完成吸附')}
async function run(){if(running.value)return;running.value=true;result.value='运行中';const reports=[]
const check=async(name,fn)=>{await fn();reports.push({name,passed:true})}
try{
await resetTabs()
await check('页签跟手，相邻预览隔离交互，吸附后只保留当前内容',async()=>{const state=await begin(view());await move(state,-48,0);assert(tab.value==='a','拖动中提前修改页签');assert(document.querySelectorAll('#touch-tabs [data-page]').length===2,'未渲染相邻预览');assert(document.querySelector("#touch-tabs .my-is-preview").inert,'预览未隔离焦点');assert(getComputedStyle(document.querySelector("#touch-tabs .my-tab-track")).transform!=='none','没有跟手位移');await move(state,-145,0);await end(state);await settled();assert(tab.value==='b','未切换下一页');assert(document.querySelectorAll('#touch-tabs [data-page]').length===1,'预览未清理')})
await check('页签跳过禁用项，首尾不循环',async()=>{await drag(view(),-145,0);await settled();assert(tab.value==='c','未跳过禁用页签');await drag(view(),-145,0);await settled();assert(tab.value==='c','末尾不应循环');await drag(view(),145,0);await settled();assert(tab.value==='b','向右未返回上页')})
await check('慢速轻拖回弹，不误切换',async()=>{await resetTabs();await drag(view(),-24,0,14);await settled();assert(tab.value==='a','轻拖误切换')})
await check('纵向意图保留页面滚动',async()=>{await drag(view(),-8,120);await settled();assert(tab.value==='a','纵向滚动误切页')})
await check('输入和显式忽略区域不被接管',async()=>{await drag(document.querySelector('#touch-tabs input'),-150,0);await drag(document.querySelector('#touch-tabs [data-swipe-ignore]'),-150,0);assert(tab.value==='a','操作控件时误切页')})
await check('嵌套横向滚动优先',async()=>{const inner=document.querySelector('#touch-tabs .scroll-test');inner.scrollLeft=20;await drag(inner.firstElementChild,-150,0);assert(tab.value==='a','内层滚动被页签抢走')})
await check('swipeable=false 保留点击切换',async()=>{swipeable.value=false;await nextTick();await drag(view(),-145,0);assert(tab.value==='a','关闭滑动后仍能切换');document.querySelectorAll('#touch-tabs [role=tab]')[1].click();await nextTick();assert(tab.value==='b','关闭滑动后点击失效');await resetTabs()})
await check('多指与 touchcancel 回弹并清理预览',async()=>{const state=await begin(view());await move(state,-50,0);send(state.target,'touchmove',[state.touch,contact(state.target,state.x+25,state.y,++identifier)]);await settled();assert(tab.value==='a','多指误切页');const cancelled=await begin(view());await move(cancelled,-60,0);await end(cancelled,true);await settled();assert(tab.value==='a','取消误切页')})
await check('拖动不误触内容按钮，下一次正常轻触仍可点击',async()=>{const button=document.querySelector('#touch-tabs .page-action'),before=clicks.value;await drag(button,-28,0,14);button.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,detail:1}));await settled();assert(clicks.value===before,'拖动触发点击');const state=await begin(button);await end(state);button.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,detail:1}));assert(clicks.value===before+1,'后续轻触被误拦截')})
await check('拖动中外部切换与卸载取消旧手势',async()=>{const state=await begin(view());await move(state,-70,0);tab.value='c';await nextTick();await end(state);await frame();assert(tab.value==='c','旧手势覆盖外部值');await resetTabs();const old=await begin(view());await move(old,-60,0);mounted.value=false;await nextTick();await end(old);mounted.value=true;await nextTick();await frame();assert(tab.value==='a'&&document.querySelectorAll('#touch-tabs [data-page]').length===1,'重挂载残留状态')})
for(const side of['left','right','top','bottom'])await check('Drawer '+side+' 跟手关闭、遮罩渐退和焦点恢复',async()=>{document.querySelector('#open-drawer').focus();const panel=await open('drawer',side);const header=panel.querySelector(".my-drawer-header"),state=await begin(header),x=['left','right'].includes(side)?(side==='left'?-48:48):0,y=['top','bottom'].includes(side)?(side==='top'?-48:48):0;await move(state,x,y);assert(panel.style.translate!=='','抽屉没有跟手');const alpha=+panel.parentElement.querySelector(".my-drawer-scrim").style.opacity;assert(alpha>0&&alpha<1,'遮罩没有跟随');await move(state,x*3,y*3);await end(state);await until(()=>!drawer.value&&!shown('#touch-drawer'),()=>JSON.stringify({model:drawer.value,shown:shown('#touch-drawer'),root:panel.parentElement.outerHTML.slice(0,350),translate:panel.style.translate,animations:panel.getAnimations().map(a=>({state:a.playState,time:a.currentTime}))}));assert(document.activeElement.id==='open-drawer','未返回触发器焦点')})
await check('抽屉轻拖回弹，外部关闭与重开不残留位移',async()=>{const panel=await open('drawer');await drag(panel.querySelector(".my-drawer-header"),24,0,14);await until(()=>!panel.hasAttribute('data-swipe-dragging'),'抽屉未回弹');assert(drawer.value&&panel.style.translate==='','回弹状态错误');const state=await begin(panel.querySelector(".my-drawer-header"));await move(state,55,0);drawer.value=false;await nextTick();await end(state);await closeAll();const again=await open('drawer');assert(again.style.translate===''&&getComputedStyle(again.parentElement.querySelector(".my-drawer-scrim")).opacity==='1','重开状态不干净');await closeAll()})
await check('抽屉方向变化与视口变化打断旧手势',async()=>{let panel=await open('drawer');let state=await begin(panel.querySelector(".my-drawer-header"));await move(state,60,0);placement.value='left';await nextTick();await end(state);assert(drawer.value&&panel.style.translate==='','方向变化未清理位移');await closeAll();panel=await open('drawer');state=await begin(panel.querySelector(".my-drawer-header"));await move(state,50,0);window.dispatchEvent(new Event('resize'));await nextTick();await end(state);assert(drawer.value&&panel.style.translate==='','尺寸变化未取消手势');await closeAll()})
await check('Sheet 顶部正文下拉关闭，滑动不触发正文按钮',async()=>{const panel=await open('sheet'),button=panel.querySelector('#panel-action'),before=clicks.value;await drag(button,0,145);button.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,detail:1}));await until(()=>!sheet.value&&!shown('#touch-sheet'),'面板未关闭');assert(clicks.value===before,'下拉误触按钮')})
await check('Sheet 正文已滚动时优先滚动，输入框不触发关闭',async()=>{const panel=await open('sheet'),body=panel.querySelector(".my-sheet-body");body.scrollTop=100;await drag(body.querySelector('.panel-row'),0,160);assert(sheet.value&&!panel.hasAttribute('data-swipe-dragging'),'正文滚动误关闭');body.scrollTop=0;await drag(panel.querySelector('input'),0,160);assert(sheet.value&&!panel.hasAttribute('data-swipe-dragging'),'输入触摸误关闭');await closeAll()})
await check('Sheet touchcancel 回弹，关闭开关对两类面板生效',async()=>{const panel=await open('sheet'),state=await begin(panel.querySelector('h3'));await move(state,0,70);await end(state,true);await until(()=>!panel.hasAttribute('data-swipe-dragging'),'取消未回弹');assert(sheet.value,'取消导致关闭');swipeable.value=false;await nextTick();await drag(panel.querySelector('h3'),0,170);assert(sheet.value,'禁用的面板被滑动关闭');await closeAll();const side=await open('drawer');await drag(side.querySelector(".my-drawer-header"),170,0);assert(drawer.value,'禁用的抽屉被滑动关闭');await closeAll();swipeable.value=true})
await check('API 面板与抽屉透传 swipeable，并可正常返回结果',async()=>{for(const kind of['sheet','drawer']){const handle=kind==='sheet'?popup.showSheet({title:'API 禁用滑动',swipeable:false,content:()=>h('p','API 内容')}):popup.showDrawer({title:'API 禁用滑动',swipeable:false,content:()=>h('p','API 内容')});await nextTick();await until(()=>!document.querySelector('.my-'+kind+'-motion-enter-active'),'API 未完成进入');const panel=[...document.querySelectorAll('[role=dialog]')].find(e=>e.textContent.includes('API 内容'));await drag(panel.querySelector(kind==='sheet'?'h3':".my-drawer-header"),kind==='drawer'?160:0,kind==='sheet'?160:0);assert(panel.isConnected&&getComputedStyle(panel.parentElement).display!=='none','API 禁用滑动失效');handle.close('完成');assert(await handle.closed==='完成','API 返回值错误');await until(()=>!panel.isConnected,'API 未清理')}})
await check('普通关闭后释放滚动和背景隔离',async()=>{assert(document.documentElement.style.overflow!=='hidden','页面滚动未释放');assert(!document.querySelector('#app').inert,'页面未恢复交互')})
result.value=JSON.stringify({passed:true,reduced:matchMedia('(prefers-reduced-motion:reduce)').matches,cases:reports.length,reports},null,2)
}catch(error){result.value=JSON.stringify({passed:false,error:String(error),reports},null,2);await closeAll()}finally{running.value=false}}
return()=>h('main',[
h('h1','跟手滑动检查'),h('div',{class:'tools'},[h(Button,{onClick:run,disabled:running.value},()=> '运行触摸定向检查'),h(Button,{id:'open-drawer',onClick:()=>open('drawer')},()=> '打开触摸抽屉'),h(Button,{id:'open-sheet',onClick:()=>open('sheet')},()=> '打开触摸面板')]),
mounted.value?h(Tabs,{id:'touch-tabs',modelValue:tab.value,options,label:'触摸页签',swipeable:swipeable.value,'onUpdate:modelValue':value=>tab.value=value},{default:({value})=>h('div',{class:'test-page','data-page':value},[h('h2',value==='a'?'概览':value==='b'?'文件':'动态'),h('p','左右滑动，或者纵向滚动页面。'),h('button',{class:'page-action',onClick:()=>clicks.value++},'内容按钮'),h('input',{'aria-label':'页签输入'}),h('span',{'data-swipe-ignore':''},'保留手势区域'),h('div',{class:'scroll-test'},[h('div','横向滚动内容')])])}):null,
h('p',`当前页：${tab.value} · 点击：${clicks.value} · 关闭：${closes.value}`),h('pre',{role:'status'},result.value),
h(Drawer,{id:'touch-drawer',title:'触摸抽屉',modelValue:drawer.value,placement:placement.value,swipeable:swipeable.value,'onUpdate:modelValue':value=>drawer.value=value,onClose:()=>closes.value++},panelBody),
h(Sheet,{id:'touch-sheet',title:'触摸面板',modelValue:sheet.value,swipeable:swipeable.value,'onUpdate:modelValue':value=>sheet.value=value,onCancel:()=>closes.value++},panelBody),h(Popup)])
}}).mount('#app')
</script></html>
