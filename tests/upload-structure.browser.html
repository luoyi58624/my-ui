<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload / AppBar / Notice / Steps 定向回归</title>
<link rel="stylesheet" href="/lib/my-ui.css"><script src="/lib/my-ui.js"></script>
<style>main{max-width:820px;margin:auto;padding:24px}#fixture{margin:24px 0;max-width:600px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 monospace}</style>
<main><h1>上传与页面结构组件</h1><button id="run" disabled>运行上传与结构回归</button><div id="fixture"></div><pre id="result">尚未运行</pre></main>
<script type="module">

    const original = [], c = add('Upload', { value: original }); c.exposed.addFiles([file()]); await tick(); equal(original, []); equal(c.p.value[0].status, 'ready'); equal(c.p.value[0].file.name, '笔记.txt'); assert(c.element.textContent.includes('待上传') && !c.element.textContent.includes('已上传'), '无请求仍显示上传成功'); assert(c.element.querySelector('input').disabled, '单选已满仍允许选择')

    const transfer = new DataTransfer(); transfer.items.add(file()); transfer.items.add(file('照片.png', 'image/png')); const input = c.element.querySelector('input'); input.files = transfer.files; input.dispatchEvent(new Event('change', { bubbles: true })); equal(count, 1); equal(rejected[0].reason, 'accept'); equal(input.value, '')

  await check('AppBar leading 覆盖返回，长标题省略，sticky 不抢占页面固定定位', async () => {

  await check('Notice 状态、图标、纯文本正文与辅助语义', async () => {
    const c = add('Notice', { type: 'error', title: '失败', message: '<b>按文本展示</b>' }); equal(c.element.getAttribute('role'), 'alert'); equal(c.element.querySelector('.my-notice-message').textContent, '<b>按文本展示</b>'); c.update({ type: 'success', icon: false }); equal(c.element.getAttribute('role'), 'status'); assert(c.element.querySelector('.my-notice-icon').hidden && !c.element.querySelector('b'), '图标或文本处理错误')
  })
  await check('Notice 关闭立即隔离焦点，淡出后隐藏，重新展开可交互', async () => {
    let closed = 0; const c = add('Notice', { message: '可关闭', closable: true, onClose: () => closed++ }); const button = c.element.querySelector('button'); button.focus(); button.click(); equal(c.p.value, false); equal(closed, 1); assert(c.element.inert && c.element.getAttribute('aria-hidden') === 'true' && !c.element.contains(document.activeElement), '关闭后仍保留可操作焦点'); if (!matchMedia('(prefers-reduced-motion:reduce)').matches) assert(!c.element.hidden, '缺少淡出阶段'); await pause(220); assert(c.element.hidden, '离场后没有隐藏'); c.update({ value: true }); await tick(); await tick(); assert(!c.element.hidden && !c.element.inert, '不能重新展开')

  await check('Notice 快速关闭后重新打开，不会被旧计时器隐藏', async () => {
    const c = add('Notice', { message: '通知' }); c.update({ value: false }); c.update({ value: true }); await pause(230); assert(!c.element.hidden && !c.element.classList.contains('my-closed'), '旧关闭任务覆盖了新状态')

    const c = add('Steps', { options, value: 1, status: 'error' }); equal(c.element.querySelectorAll('button').length, 0); equal(c.element.querySelectorAll('.my-finish').length, 1); equal(c.element.querySelectorAll('.my-error').length, 1); equal(c.element.querySelector('[aria-current="step"]').querySelector('.my-step-label').textContent, '确认内容'); assert(c.element.textContent.includes('发生错误'), '缺少可访问状态'); c.update({ value: 4 }); equal(c.element.querySelectorAll('.my-finish').length, 4); assert(!c.element.querySelector('[aria-current]'), '全部完成仍标记某一步进行中')
  })
  await check('Steps 状态保留给辅助技术，不额外占据可见文字布局', async () => {
    const c = add('Steps', { options, value: 1 }), status = c.element.querySelector('.my-sr-only'), rect = status.getBoundingClientRect(); assert(rect.width <= 1.1 && rect.height <= 1.1 && getComputedStyle(status).position === 'absolute', '辅助状态泄漏到可见布局'); assert(status.textContent === '已完成' && !status.hidden && !status.hasAttribute('aria-hidden'), '辅助技术无法读取状态')

    let value; const c = add('Steps', { options, value: 0, interactive: true, onChange: next => value = next }); c.exposed.focus(); key(document.activeElement, 'ArrowRight'); equal(value, 1); key(document.activeElement, 'ArrowRight'); equal(value, 3); key(document.activeElement, 'Home'); equal(value, 0); key(document.activeElement, 'End'); equal(value, 3); equal(c.element.querySelectorAll('[tabindex="0"]').length, 1); assert(!key(document.activeElement, 'Tab').defaultPrevented, '步骤条锁住 Tab'); c.update({ disabled: true }); c.element.querySelector('button').click(); equal(value, 3)
  })
  await check('Steps 纵向键盘使用上下键，动态数量和空列表安全', async () => {
    let value; const c = add('Steps', { options, interactive: true, vertical: true, onChange: next => value = next }); c.exposed.focus(); key(document.activeElement, 'ArrowDown'); equal(value, 1); key(document.activeElement, 'ArrowUp'); equal(value, 0); c.update({ options: [] }); equal(c.element.children.length, 0); c.exposed.focus()
  })
  await check('Steps 删除或禁用当前焦点项，焦点回到仍可用的步骤', async () => {

    const files = ref([]), upload = ref(), task = deferred(); let context; app = createApp({ render: () => h(Upload, { ref: upload, modelValue: files.value, request: (_, ctx) => { context = ctx; return task.promise }, 'onUpdate:modelValue': value => files.value = value }) }); app.mount(fixture); await tick(); upload.value.addFiles([file()]); await tick(); equal(files.value[0].status, 'uploading'); context.onProgress(42); await tick(); equal(files.value[0].percentage, 42); upload.value.abort(); await tick(); equal(files.value[0].status, 'canceled'); upload.value.retry(files.value[0].id); await tick(); app.unmount(); app = undefined; assert(context.signal.aborted, 'Vue 卸载没有中止请求'); task.resolve('late'); await tick(); equal(files.value[0].status, 'uploading')
