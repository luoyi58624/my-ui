[package]
name = "my-ui-example"
version = "1.0.0"
description = "加载现有 my-ui 示例的桌面应用"
edition = "2024"
rust-version = "1.90"

[lib]
name = "my_ui_example_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-store = "2.5.0"
# Bun 安装完整插件源码，换用 GitHub 依赖时无需改 Cargo 路径。
tauri-plugin-android-system-font-weight = { path = "../node_modules/tauri-plugin-android-system-font-weight" }
tauri-plugin-native-router = { path = "../node_modules/tauri-plugin-native-router" }
tauri-plugin-native-components = { path = "../node_modules/tauri-plugin-native-components" }
