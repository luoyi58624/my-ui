[package]
name = "my-ui-example"
version = "1.0.0"
description = "加载 examples/vue 前端产物的桌面与 Android 壳"
edition = "2024"
rust-version = "1.90"

[lib]
name = "my_ui_example_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-store = "2.5.0"
# Bun 把完整插件源码安装在壳自己的 node_modules，换用 GitHub 依赖时无需改 Cargo 路径。
tauri-plugin-android-system-font-weight = { path = "./node_modules/tauri-plugin-android-system-font-weight" }
tauri-plugin-native-components = { path = "./node_modules/tauri-plugin-native-components" }
